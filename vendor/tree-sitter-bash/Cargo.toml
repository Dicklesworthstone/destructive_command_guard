[package]
edition = "2021"
name = "tree-sitter-bash-dcg"
version = "0.25.1"
authors = [
    "Max Brunsfeld <maxbrunsfeld@gmail.com>",
    "Amaan Qureshi <amaanq12@gmail.com>",
]
build = "bindings/rust/build.rs"
include = [
    "LICENSE",
    "bindings/rust/*",
    "grammar.js",
    "queries/*",
    "src/*",
    "tree-sitter.json",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "tree-sitter-bash 0.25.1 with the scanner and redirection fixes destructive_command_guard depends on (dcg #442, #461)"
