          exit 1

  # Process-per-invocation perf regression gate (compares against committed baseline JSON)
  perf-regression:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
        with:
          # The absolute gate binds the binary's full Git object id to this
          # checkout and retains `git describe` as supplemental diagnostics.
          # Full history keeps that description reproducible.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-regression-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Run perf baseline + compare to repo baseline
        id: perf
        run: |
          set +e

          BASELINE_JSON="perf/baselines/2026-01-11-after-lazy.json"
          PERF_ARTIFACT_DIR="$RUNNER_TEMP/dcg-perf-relative"
          mkdir -p "$PERF_ARTIFACT_DIR"
          CURRENT_JSON="$PERF_ARTIFACT_DIR/perf-current.json"
          REPORT_MD="$PERF_ARTIFACT_DIR/perf-regression-report.md"

          python3 scripts/perf_baseline.py \
            --bin target/release/dcg \
            --output "$CURRENT_JSON" \
            --warmup 10 \
            --runs 80 \
            --skip-trace
          GEN_EXIT=$?
          if [ "$GEN_EXIT" -ne 0 ]; then
            echo "exit_code=$GEN_EXIT" >> $GITHUB_OUTPUT
            echo "::error::perf baseline generation failed (exit code $GEN_EXIT)"
            exit 0
          fi

          python3 - "$BASELINE_JSON" "$CURRENT_JSON" "$REPORT_MD" <<'PY'
          import json
          import math
          import sys

          baseline_path = sys.argv[1]
          current_path = sys.argv[2]
          report_path = sys.argv[3]

          mult = 2.5
          slack_ms = 5.0
          rss_slack_kb = 8192

          def reject_non_finite_json_constant(value):
              raise ValueError(f"non-standard JSON numeric constant: {value}")

          with open(baseline_path, "r", encoding="utf-8") as handle:
              baseline = json.load(
                  handle, parse_constant=reject_non_finite_json_constant
              )
          with open(current_path, "r", encoding="utf-8") as handle:
              current = json.load(
                  handle, parse_constant=reject_non_finite_json_constant
              )

          violations = []
          rows = []

          def finite_nonnegative_number(value, label):
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  violations.append(f"{label} must be a JSON number")
                  return None
              numeric = float(value)
              if not math.isfinite(numeric) or numeric < 0:
                  violations.append(f"{label} must be finite and nonnegative")
                  return None
              return numeric

          def optional_nonnegative_rss(value, label):
              if value is None:
                  return None
              if isinstance(value, bool) or not isinstance(value, int) or value < 0:
                  violations.append(f"{label} must be a nonnegative integer or null")
                  return None
              return value

          baseline_case_list = baseline.get("cases", [])
          current_case_list = current.get("cases", [])

          def duplicate_ids(cases):
              ids = [case["id"] for case in cases]
              return sorted(case_id for case_id in set(ids) if ids.count(case_id) > 1)

          for label, cases in (("baseline", baseline_case_list), ("current", current_case_list)):
              duplicates = duplicate_ids(cases)
              if duplicates:
                  violations.append(f"duplicate case ids in {label}: {', '.join(duplicates)}")

          baseline_cases = {c["id"]: c for c in baseline_case_list}
          current_cases = {c["id"]: c for c in current_case_list}

          required_baseline_case_ids = {
              "quick_reject",
              "safe_keyword",
              "destructive_keyword",
              "heredoc_inline",
              "bypass",
          }
          missing_baseline_ids = sorted(
              required_baseline_case_ids - set(baseline_cases)
          )
          if missing_baseline_ids:
              violations.append(
                  "committed baseline is missing required case ids: "
                  + ", ".join(missing_baseline_ids)
              )

          for case_id in sorted(baseline_cases.keys()):
              if case_id not in current_cases:
                  violations.append(f"missing case in current run: {case_id}")
                  continue

              b = baseline_cases[case_id].get("metrics", {})
              c = current_cases[case_id].get("metrics", {})

              b_p50 = finite_nonnegative_number(
                  b.get("p50_ms"), f"baseline {case_id} p50_ms"
              )
              c_p50 = finite_nonnegative_number(
                  c.get("p50_ms"), f"current {case_id} p50_ms"
              )
              if b_p50 is None or c_p50 is None:
                  continue

              limit_p50 = b_p50 * mult + slack_ms
              status = "OK" if c_p50 <= limit_p50 else "REGRESSED"
              rows.append((case_id, b_p50, c_p50, limit_p50, status))

              if status != "OK":
                  violations.append(
                      f"{case_id} p50_ms {c_p50:.2f} > {limit_p50:.2f} (baseline {b_p50:.2f}, mult {mult}x + {slack_ms}ms)"
                  )

              b_rss = optional_nonnegative_rss(
                  b.get("max_rss_kb"), f"baseline {case_id} max_rss_kb"
              )
              c_rss = optional_nonnegative_rss(
                  c.get("max_rss_kb"), f"current {case_id} max_rss_kb"
              )
              if b_rss is not None and c_rss is not None:
                  rss_limit = max(int(b_rss * 2.0), b_rss + rss_slack_kb)
                  if c_rss > rss_limit:
                      violations.append(
                          f"{case_id} max_rss_kb {c_rss} > {rss_limit} (baseline {b_rss})"
                      )

          # Historical baselines are intentionally sparse. Current-only cases
          # remain visible here and are enforced by the absolute evaluator-cost
          # gate below; inventing retroactive limits would fabricate evidence.
          extra_cases = sorted(set(current_cases.keys()) - set(baseline_cases.keys()))
          for case_id in extra_cases:
              c = current_cases[case_id].get("metrics", {})
              c_p50 = finite_nonnegative_number(
                  c.get("p50_ms"), f"current {case_id} p50_ms"
              )
              optional_nonnegative_rss(
                  c.get("max_rss_kb"), f"current {case_id} max_rss_kb"
              )
              if c_p50 is not None:
                  rows.append((case_id, None, c_p50, None, "UNBASELINED"))

          # Write report (Markdown for GHA summary + artifacts)
          lines = []
          lines.append("## Perf Regression Gate")
          lines.append("")
          lines.append(f"- Baseline: `{baseline_path}`")
          lines.append(f"- Threshold: `current_p50_ms <= baseline_p50_ms * {mult} + {slack_ms}ms`")
          lines.append(f"- RSS slack: `max(baseline*2, baseline+{rss_slack_kb}KB)` (when available)")
          lines.append("- Current-only cases: `UNBASELINED`; enforced by the absolute gate below")
          lines.append("")
          lines.append("| Case | Baseline p50 (ms) | Current p50 (ms) | Limit (ms) | Status |")
          lines.append("|------|-------------------|-----------------|-----------|--------|")
          for case_id, b_p50, c_p50, limit_p50, status in rows:
              if status == "UNBASELINED":
                  lines.append(f"| `{case_id}` | — | {c_p50:.2f} | — | {status} |")
              else:
                  lines.append(f"| `{case_id}` | {b_p50:.2f} | {c_p50:.2f} | {limit_p50:.2f} | {status} |")
          lines.append("")

          if violations:
              lines.append("### Violations")
              lines.append("")
              for v in violations[:10]:
                  lines.append(f"- {v}")
              if len(violations) > 10:
                  lines.append(f"- ... and {len(violations) - 10} more")
              lines.append("")

          with open(report_path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
              handle.write("\n")

          if violations:
              for v in violations[:5]:
                  print(f"::error::{v}")
              sys.exit(1)
          sys.exit(0)
          PY

          CHECK_EXIT=$?
          echo "exit_code=$CHECK_EXIT" >> $GITHUB_OUTPUT

          echo "## Perf Regression" >> $GITHUB_STEP_SUMMARY
          cat "$REPORT_MD" >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

          exit 0

      - name: Upload perf regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-regression-artifacts
          path: |
            ${{ runner.temp }}/dcg-perf-relative/perf-current.json
            ${{ runner.temp }}/dcg-perf-relative/perf-regression-report.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Check perf regression result
        if: steps.perf.outputs.exit_code != '0'
        run: |
          echo "::error::Perf regression gate failed (exit code ${{ steps.perf.outputs.exit_code }}). See 'perf-regression-artifacts' and the step summary."
          exit 1

      # ABSOLUTE latency gate (#245). The comparison above is a RELATIVE
      # ratchet against a recorded baseline: if a change makes every case
      # uniformly slower, the baseline is simply re-recorded and the product's
      # fixed hook deadline is never consulted. That is exactly how a ~215ms
      # per-invocation cost shipped against a 200ms budget and turned ordinary
      # commands into fail-closed review prompts for every user. This gate
      # pairs each full hook invocation with DCG_BYPASS and asserts the p95 of
      # the matched difference against the SHIPPED default budget. Process
      # spawn sits outside that in-process deadline, so raw end-to-end p95 is
      # retained as evidence but is not substituted for evaluator cost. The
      # run uses a hermetic HOME and no ambient DCG_* overrides. One hundred
      # samples also support the harness's 95/95 one-sided binomial tolerance
      # rule (at most one over-limit sample per case).
      - name: Absolute evaluator-cost gate vs shipped default budget
        run: |
          LATENCY_ARTIFACT_DIR="$RUNNER_TEMP/dcg-perf-latency"
          mkdir -p "$LATENCY_ARTIFACT_DIR"
          python3 -B scripts/perf_baseline.py --self-test
          BUDGET_MS=$(grep -oP 'pub const HOOK_EVALUATION_BUDGET_MS: u64 = \K[0-9_]+' src/perf.rs | tr -d '_')
          if ! [[ "$BUDGET_MS" =~ ^[0-9]+$ ]] || [ "$BUDGET_MS" -le 0 ]; then
            echo "::error::HOOK_EVALUATION_BUDGET_MS must be one positive integer"
            exit 1
          fi
          echo "Shipped default hook budget: ${BUDGET_MS}ms"
          python3 scripts/perf_baseline.py \
            --bin target/release/dcg \
            --skip-trace --warmup 5 --runs 100 \
            --assert-budget-ms "$BUDGET_MS" \
            --assert-margin-pct 50 \
            --output "$LATENCY_ARTIFACT_DIR/perf-latency-gate.json"

      - name: Upload absolute latency gate certificate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-latency-gate-certificate
          path: ${{ runner.temp }}/dcg-perf-latency/perf-latency-gate.json
          retention-days: 14
          if-no-files-found: error

      - name: Harness protocol matrix (real binary, every agent wire format)
        run: |
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y jq
          bash scripts/e2e_harness_matrix.sh --binary target/release/dcg

      - name: Local installer + hook e2e (public release path)
        # Verifies the LATEST PUBLISHED artifact for this runner's platform
        # still installs and guards commands. Non-blocking: it exercises the
        # published release, not this PR's code, so a release-side problem must
        # not block unrelated PRs — it surfaces as a warning annotation.
        # GH_TOKEN is required or `gh release view` cannot resolve the version
        # and the step would silently no-op.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash scripts/e2e_fleet_install.sh --local-only; then
            echo "Published-release install path verified on this runner."
          else
            echo "::warning::local installer e2e failed against the published release — check release assets, installer target triples, and checksum/signature sidecars"
          fi

  # Deep suite: fuzzing (scheduled or manual only)
  fuzz:
    runs-on: ubuntu-latest
    # Only run on schedule or manual trigger, not on every PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
          # See fuzz-smoke job above — cargo-fuzz needs the musl target to
          # link libFuzzer + AddressSanitizer with a statically-linked libc.
          targets: x86_64-unknown-linux-musl

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache cargo registry and fuzz corpus
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/corpus
            fuzz/artifacts
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'fuzz/**') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Run fuzz tests (time-limited)
        run: |
          cd fuzz
          echo "## Fuzzing Results" >> $GITHUB_STEP_SUMMARY
          for target in fuzz_context fuzz_evaluate fuzz_hook_input fuzz_normalize fuzz_heredoc_trigger fuzz_heredoc_extract fuzz_heredoc_language fuzz_shell_extract heredoc_fuzz ast_matcher_fuzz; do
            echo "Fuzzing $target (~60s runtime + build)..."
            timeout 10m cargo fuzz run "$target" -- -max_total_time=60 || true
            echo "- $target: completed" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Published-release install matrix.
  #
  # Every other job tests THIS tree. Nothing verifies that the artifact users
  # actually download still exists, installs, and guards commands on a clean
  # machine of each supported OS. That is how #238 happened: macOS artifacts
  # were missing for six releases while `dcg update` reported no update
  # available, so Mac users silently sat on a pre-0.7.0 build with a known
  # security fix missing.
  #
  # These runners are stock, unconfigured machines — the closest thing to a
  # real new user that CI can offer. Scheduled + manual only: it exercises the
  # published release, not the commit under test.
  # ---------------------------------------------------------------------------
  published-release-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest        # Apple Silicon
            shell: bash
          - os: macos-15-intel      # x86_64 macOS
            shell: bash
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install from the published release and verify it guards (Unix)
        if: matrix.shell == 'bash'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/e2e_fleet_install.sh --local-only

      # The Windows path uses the README's scriptblock invocation, which is
      # what users actually run (and what a default Restricted ExecutionPolicy
      # requires). Assertions mirror the Unix probe.
      - name: Install from the published release and verify it guards (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem Env: | Where-Object { $_.Name -like 'DCG_*' } | ForEach-Object {
            Remove-Item "Env:$($_.Name)" -ErrorAction SilentlyContinue
          }
          $env:DCG_SELF_HEAL_HOOK = '0'
          $env:DCG_HISTORY_DISABLED = '1'

          $version = (gh release view -R ${{ github.repository }} --json tagName --jq .tagName)
          if (-not $version) { throw "could not resolve the latest published release" }
          Write-Output "Testing published release $version"

          $dest = Join-Path $env:RUNNER_TEMP 'dcg-bin'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $src = Invoke-RestMethod -Uri "https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1"
          & ([scriptblock]::Create($src)) -Version $version -Dest $dest -Verify -NoConfigure

          $bin = Join-Path $dest 'dcg.exe'
          if (-not (Test-Path $bin)) { throw "installer produced no dcg.exe" }
          $got = (& $bin --version 2>&1 | Select-Object -First 1) -join ''
          if ($got -notlike "*$($version.TrimStart('v'))*") {
            throw "installed binary reports '$got', expected $version"
          }

          # The guard must actually deny, and must stay silent on safe input.
          $deny = '{"tool_name":"Bash","tool_input":{"command":"git reset --hard"}}'
          $out = ($deny | & $bin 2>$null | Out-String)
          if ($out -notmatch '"permissionDecision"\s*:\s*"deny"') {
            throw "published Windows binary did NOT deny 'git reset --hard'"
          }
          $allow = '{"tool_name":"Bash","tool_input":{"command":"git status"}}'
          $out = ($allow | & $bin 2>$null | Out-String).Trim()
          if (-not [string]::IsNullOrEmpty($out)) {
            throw "published Windows binary emitted output for a safe command"
          }

          # Native-Windows packs must be default-ON (docs/windows.md).
          $ps = '{"tool_name":"PowerShell","tool_input":{"command":"Remove-Item -Recurse -Force C:\\data"}}'
          $out = ($ps | & $bin 2>$null | Out-String)
          if ($out -notmatch 'deny|block') {
            throw "windows.filesystem is not default-on in the published build"
          }

          # #245 guard: ordinary commands must reach a verdict on the stock budget.
          foreach ($c in @('echo hi 2>NUL', 'cp report.txt backup.txt', 'rm ./scratch.txt')) {
            $p = '{"tool_name":"Bash","tool_input":{"command":"' + $c.Replace('\','\\').Replace('"','\"') + '"}}'
            $o = ($p | & $bin 2>$null | Out-String)
            if ($o -match 'could not complete safety evaluation' -or $o -match '"ask"') {
              throw "published build returned an indeterminate verdict for '$c' on the stock budget (#245 class)"
            }
          }
          Write-Output "Published release verified on native Windows."
