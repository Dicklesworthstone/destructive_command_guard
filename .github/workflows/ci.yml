name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    # Allow manual triggering for deep suite

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Dependabot config
        run: |
          ruby -e 'require "yaml"; config = YAML.load_file(".github/dependabot.yml"); puts "Dependabot config:"; puts config.inspect'

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install UBS
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Dicklesworthstone/ultimate_bug_scanner/main/install.sh" \
            | bash -s -- --easy-mode
          # Add UBS to PATH for this job
          echo "$HOME/.ubs" >> $GITHUB_PATH

      - name: Run UBS on changed files
        if: always()
        run: |
          echo "=== UBS Static Analysis ===" | tee -a ubs-output.log
          echo "Timestamp: $(date -Iseconds)" | tee -a ubs-output.log
          echo "" | tee -a ubs-output.log

          echo "=== UBS Smoke Test ===" | tee -a ubs-output.log
          cat > /tmp/ubs_smoke.rs <<'EOF'
          fn main() {
              println!("ubs smoke test");
          }
          EOF
          if ubs --verbose /tmp/ubs_smoke.rs 2>&1 | tee -a ubs-output.log; then
            echo "UBS Smoke Test: PASSED" | tee -a ubs-output.log
          else
            echo "UBS Smoke Test: WARNINGS (non-blocking)" | tee -a ubs-output.log
            echo "::warning::UBS smoke test reported issues"
          fi
          echo "" | tee -a ubs-output.log

          # Get changed Rust files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- "*.rs" | tr "\n" " ")
            echo "Mode: Pull Request (base: ${{ github.base_ref }})" | tee -a ubs-output.log
          else
            CHANGED=$(git diff --name-only HEAD~1 -- "*.rs" | tr "\n" " ")
            echo "Mode: Push (comparing to HEAD~1)" | tee -a ubs-output.log
          fi

          echo "Changed files: ${CHANGED:-none}" | tee -a ubs-output.log
          echo "" | tee -a ubs-output.log

          if [ -n "$CHANGED" ]; then
            echo "Running UBS analysis..." | tee -a ubs-output.log
            if ubs --verbose $CHANGED 2>&1 | tee -a ubs-output.log; then
              echo "" | tee -a ubs-output.log
              echo "UBS Result: PASSED (no issues found)" | tee -a ubs-output.log
            else
              echo "" | tee -a ubs-output.log
              echo "UBS Result: WARNINGS (issues found - non-blocking)" | tee -a ubs-output.log
              echo "::warning::UBS found potential issues in changed files"
            fi
          else
            echo "UBS Result: SKIPPED (no Rust files changed)" | tee -a ubs-output.log
          fi

          echo "" | tee -a ubs-output.log
          echo "=== End UBS Analysis ===" | tee -a ubs-output.log

      - name: UBS summary
        if: always()
        run: |
          echo "## UBS Static Analysis" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat ubs-output.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No UBS output" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload UBS output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ubs-output
          path: ubs-output.log
          retention-days: 7

      - name: Check compilation
        run: cargo check --all-targets

      - name: Check lean build without rich output
        run: cargo check --all-targets --no-default-features

      - name: Build release binary for tests
        run: cargo build --release

      - name: Run tests (with JUnit XML report)
        run: |
          cargo nextest run --profile ci --no-fail-fast

      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count pack tests
          PACK_TESTS=$(cargo test packs:: -- --list 2>/dev/null | grep -c "test$" || echo "0")
          TOTAL_TESTS=$(cargo test -- --list 2>/dev/null | grep -c "test$" || echo "0")

          echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | $TOTAL_TESTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Pack Tests | $PACK_TESTS |" >> $GITHUB_STEP_SUMMARY

      - name: Test count sentinel
        run: |
          TOTAL_TESTS=$(cargo test -- --list 2>/dev/null | grep -c "test$" || echo "0")
          MIN_TESTS=3700
          if [ "$TOTAL_TESTS" -lt "$MIN_TESTS" ]; then
            echo "::error::Test count dropped to $TOTAL_TESTS (minimum $MIN_TESTS). If tests were intentionally removed, update MIN_TESTS in ci.yml."
            exit 1
          fi
          echo "Test count sentinel: $TOTAL_TESTS >= $MIN_TESTS"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-check
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  # Native-Windows regression coverage. Until this existed, every CI job ran on
  # ubuntu-latest, so Windows-specific breakage (cfg gating, .exe-suffix path
  # bugs, behavior drift) was completely uncovered. Uses the nightly toolchain
  # with the MSVC target because rust-toolchain.toml pins nightly / edition 2024.
  check-windows:
    name: check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run full test suite
        run: cargo nextest run --profile ci --no-fail-fast

      - name: Regression guard - test binary paths must include EXE_SUFFIX
        shell: bash
        run: |
          # win-test-binary-exe-suffix: the `dcg_binary()` test helpers spawn the
          # built binary and must resolve `dcg.exe` on Windows. The original bug
          # was `path.push("dcg")` (after popping to target/) with no suffix.
          # Fail the build if that pattern returns — use env!("CARGO_BIN_EXE_dcg")
          # or append std::env::consts::EXE_SUFFIX. (Config-dir `.join("dcg")`
          # for ~/.config/dcg is legitimate and intentionally NOT matched.)
          if grep -rnE 'push\("dcg"\)' tests/; then
            echo "::error::Found a bare push(\"dcg\") test-binary path without EXE_SUFFIX (breaks Windows test isolation)."
            exit 1
          fi
          echo "OK: no bare push(\"dcg\") test-binary paths."

      - name: Installer pwsh unit tests (hook-merge / zip-slip / flags / local-source / detection)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = Get-ChildItem -Path tests/installer -Filter '*_test.ps1' | Sort-Object Name
          if ($tests.Count -eq 0) { throw 'no installer pwsh tests found under tests/installer' }
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "== $($t.Name) =="
            & pwsh -NoProfile -File $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) { throw ("installer tests failed: " + ($failed -join ', ')) }
          Write-Host "All $($tests.Count) installer pwsh tests passed."

      - name: Installer smoke (hermetic, network-free, real dcg.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Reuse the binary the test job already built (debug); fall back to a
          # build only if absent. The smoke validates installer mechanics + that
          # the REAL binary runs, not release optimization.
          $exe = if (Test-Path 'target/release/dcg.exe') { 'target/release/dcg.exe' }
                 elseif (Test-Path 'target/debug/dcg.exe') { 'target/debug/dcg.exe' }
                 else { cargo build --bin dcg; 'target/debug/dcg.exe' }
          Write-Host "Using binary: $exe"

          # Stage + zip in the dist.yml layout: dcg-<target>/dcg.exe
          $target = 'x86_64-pc-windows-msvc'
          $work = Join-Path $env:RUNNER_TEMP ('smoke_' + [Guid]::NewGuid().ToString('N'))
          $stageRoot = Join-Path $work 'stage'
          $stage = Join-Path $stageRoot "dcg-$target"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $exe (Join-Path $stage 'dcg.exe') -Force
          $zip = Join-Path $work "dcg-$target.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stageRoot, $zip)
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          $fileUri = ([System.Uri]("file://" + $zip)).AbsoluteUri
          Write-Host "zip=$zip"
          Write-Host "sha256=$hash"

          # ---- Pass 1: hermetic install + -Verify, no agent config ----
          Write-Host '== Pass 1: -NoConfigure -Verify (hermetic) =='
          $dest1 = Join-Path $work 'bin1'
          & pwsh -NoProfile -File ./install.ps1 -ArtifactUrl $fileUri -Checksum $hash -Dest $dest1 -NoConfigure -Verify
          if ($LASTEXITCODE -ne 0) { throw "Pass 1 installer exited $LASTEXITCODE" }
          $installed1 = Join-Path $dest1 'dcg.exe'
          if (-not (Test-Path $installed1)) { throw "Pass 1: binary not installed at $installed1" }
          # The installed real binary must run and DENY a destructive command...
          $deny = '{"tool_name":"Bash","tool_input":{"command":"git reset --hard"}}' | & $installed1
          if ($deny -notmatch 'permissionDecision') { throw "Pass 1: installed dcg.exe did not deny 'git reset --hard'" }
          # ...and ALLOW (silent) a safe one.
          $allow = '{"tool_name":"Bash","tool_input":{"command":"git status"}}' | & $installed1
          if (-not [string]::IsNullOrWhiteSpace($allow)) { throw "Pass 1: 'git status' should be allowed (silent), got: $allow" }
          Write-Host 'Pass 1 OK: installed; denies destructive, allows safe'

          # ---- Pass 2: agent hook creation into a sandboxed HOME/USERPROFILE ----
          Write-Host '== Pass 2: Claude + Codex hook creation (sandboxed home, UTF-8 no BOM) =='
          $home2 = Join-Path $work 'home2'
          New-Item -ItemType Directory -Path (Join-Path $home2 '.codex') -Force | Out-Null  # make Codex "detected"
          $dest2 = Join-Path $work 'bin2'
          # Set both so the child pwsh derives $HOME from the sandbox.
          $env:USERPROFILE = $home2
          $env:HOMEDRIVE = (Split-Path -Qualifier $home2)
          $env:HOMEPATH = (Split-Path -NoQualifier $home2)
          $env:HOME = $home2
          & pwsh -NoProfile -File ./install.ps1 -ArtifactUrl $fileUri -Checksum $hash -Dest $dest2 -Force
          if ($LASTEXITCODE -ne 0) { throw "Pass 2 installer exited $LASTEXITCODE" }
          function Assert-NoBom([string]$p) {
            $b = [System.IO.File]::ReadAllBytes($p)
            if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { throw "$p has a UTF-8 BOM" }
          }
          $claudeSettings = Join-Path $home2 '.claude/settings.json'
          if (-not (Test-Path $claudeSettings)) { throw "Pass 2: Claude settings not created at $claudeSettings" }
          Assert-NoBom $claudeSettings
          $cfg = Get-Content -Raw $claudeSettings | ConvertFrom-Json
          $cmds = @($cfg.hooks.PreToolUse | ForEach-Object { $_.hooks } | ForEach-Object { $_.command })
          if (-not ($cmds | Where-Object { $_ -match 'dcg' })) { throw "Pass 2: Claude hook does not reference dcg" }
          $codexHooks = Join-Path $home2 '.codex/hooks.json'
          if (-not (Test-Path $codexHooks)) { throw "Pass 2: Codex hooks.json not created at $codexHooks" }
          Assert-NoBom $codexHooks
          Write-Host 'Pass 2 OK: Claude + Codex hooks created (UTF-8 no BOM, reference dcg)'
          Write-Host '== Installer smoke PASSED =='

      - name: E2E suite (scripts/e2e_test.ps1 against the real dcg.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Auto-discovers target\{release,debug}\dcg.exe; -Verbose for per-scenario
          # logs, -Artifacts to capture any failure. Non-zero exit gates the build.
          ./scripts/e2e_test.ps1 -Verbose -Artifacts "$env:RUNNER_TEMP/e2e-artifacts"
          if ($LASTEXITCODE -ne 0) { throw "e2e_test.ps1 reported failures (exit $LASTEXITCODE)" }

      - name: History DB concurrency / stale-lock stress (real Windows SQLite)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Validates the bundled SQLite history DB on a REAL Windows runtime:
          # N concurrent writer PROCESSES
          # must not corrupt the DB and a killed writer must not wedge later runs.
          # (History itself is best-effort telemetry — a few records may drop under
          # extreme contention by design; the test asserts no-corruption + no-wedge
          # + hooks-never-break, not 100% record completeness.)
          ./scripts/win_history_concurrency.ps1 -Count 24 -Verbose
          if ($LASTEXITCODE -ne 0) { throw "win_history_concurrency.ps1 reported failures (exit $LASTEXITCODE)" }

      - name: Pending-exception lock concurrency (real-Windows LockFileEx)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # pending_exceptions.rs uses lock_exclusive() -> Windows LockFileEx
          # (MANDATORY locking, unlike Unix advisory flock). Validates that N
          # concurrent blocked-command recordings serialize under the lock with no
          # sharing/lock violations, the lock releases on exit, and append-only
          # NDJSON lines are never torn.
          ./scripts/win_pending_exception_concurrency.ps1 -Count 24 -Verbose
          if ($LASTEXITCODE -ne 0) { throw "win_pending_exception_concurrency.ps1 reported failures (exit $LASTEXITCODE)" }

      - name: NO_COLOR / ANSI escape-leak guard (real Windows console)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Guards the high-risk hand-written-escape paths (update.rs writes raw
          # \x1b[ that would render literally as <-[33m on legacy conhost): asserts
          # ZERO raw ESC bytes across deny/explain/scan under NO_COLOR/DCG_NO_COLOR
          # and when redirected. (Cross-console VISUAL color rendering is a manual
          # eyeball step — see docs/windows.md.)
          ./scripts/win_color_nocolor.ps1
          if ($LASTEXITCODE -ne 0) { throw "win_color_nocolor.ps1 reported failures (exit $LASTEXITCODE)" }

      - name: MCP stdio server smoke (real Windows pipe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Drives `dcg mcp-server` as a live MCP client over stdio with
          # timeout-guarded reads, asserting initialize/tools-list/tools-call work
          # with NO first-read hang (the Windows console-handle / newline-framing
          # risk the rust-mcp-sdk StdioTransport could hit on Windows pipes).
          ./scripts/win_mcp_stdio.ps1
          if ($LASTEXITCODE -ne 0) { throw "win_mcp_stdio.ps1 reported failures (exit $LASTEXITCODE)" }

      - name: Update/rollback e2e (real-Windows running-binary swap)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hermetic (no network): fabricates a backup and runs `dcg update
          # --rollback`, which restores over the RUNNING file-locked binary via the
          # Windows-only swap_running_executable (rename to .exe.old + copy + restore
          # on failure). Validates backup discovery, the running-binary swap, and a
          # clean no-backup error.
          ./scripts/win_update_rollback.ps1
          if ($LASTEXITCODE -ne 0) { throw "win_update_rollback.ps1 reported failures (exit $LASTEXITCODE)" }

      - name: Interactive prompts non-TTY no-hang guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # inquire Select/Confirm prompts must be is_terminal()-gated so they SKIP
          # (never hang) when stdin is not a TTY — a missing gate would block CI /
          # pipelines forever. Asserts each prompt-bearing command exits promptly
          # with no panic under redirected stdin. (Real keyboard nav / Ctrl-C is a
          # manual console check — see docs/windows.md.)
          ./scripts/win_interactive_nontty.ps1
          if ($LASTEXITCODE -ne 0) { throw "win_interactive_nontty.ps1 reported failures (exit $LASTEXITCODE)" }

      - name: Upload Windows e2e artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-windows
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  fuzz-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          # cargo-fuzz defaults to building under x86_64-unknown-linux-musl
          # because libFuzzer + AddressSanitizer require statically-linked
          # libc; without this target installed, the build fails with
          # "sanitizer is incompatible with statically linked libc" and
          # "can't find crate for `core`".
          targets: x86_64-unknown-linux-musl

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache cargo registry and fuzz target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-smoke-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'fuzz/**') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-smoke-

      - name: Run heredoc fuzz smoke
        run: |
          cd fuzz
          # Build/run the fuzzer for the gnu host target. AddressSanitizer is
          # incompatible with musl's statically-linked libc (crt-static) and
          # fails with "sanitizer is incompatible with statically linked libc";
          # the default x86_64-unknown-linux-gnu (dynamic glibc) is the
          # supported ASan target.
          cargo fuzz run heredoc_fuzz --target x86_64-unknown-linux-gnu -- -max_total_time=30

  coverage:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      - name: Run tests with coverage
        run: |
          cargo llvm-cov --all-features --workspace \
            --ignore-filename-regex='(tests/|benches/|\.cargo/)' \
            --no-report

      - name: Generate coverage reports
        run: |
          # Generate LCOV from collected data (no re-running tests)
          # Note: report subcommand doesn't accept --all-features/--workspace
          cargo llvm-cov report \
            --ignore-filename-regex='(tests/|benches/|\.cargo/)' \
            --lcov --output-path lcov.info
          # Generate JSON for programmatic threshold checking
          cargo llvm-cov report \
            --ignore-filename-regex='(tests/|benches/|\.cargo/)' \
            --json --output-path coverage.json
          # Create human-readable summary from JSON
          jq -r '
            "Coverage Summary:",
            "  Overall: \(.data[0].totals.lines.percent | . * 100 | round / 100)% lines covered",
            "  Functions: \(.data[0].totals.functions.percent | . * 100 | round / 100)% covered",
            "",
            "File coverage (lines):",
            (.data[0].files | sort_by(-.summary.lines.percent) | .[:10][] |
              "  \(.filename | split("/") | .[-1]): \(.summary.lines.percent | . * 100 | round / 100)%")
          ' coverage.json > coverage-summary.txt
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
          name: dcg-coverage
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov upload status
        if: always()
        run: |
          echo "## Codecov Upload" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f lcov.info ]; then
            lines=$(wc -l < lcov.info)
            echo "- Coverage file: lcov.info ($lines lines)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Warning: Coverage file not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Upload: Attempted (check Codecov dashboard for status)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard: https://codecov.io/gh/Dicklesworthstone/destructive_command_guard" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage.json
            coverage-summary.txt
          retention-days: 30

      - name: Check coverage thresholds (enforced)
        run: |
          set -euo pipefail

          # Keep in sync with AGENTS.md "Coverage Job"; the
          # coverage_threshold_docs test checks these values.
          OVERALL_MIN="70.0"
          EVALUATOR_MIN="65.0"
          HOOK_MIN="70.0"

          # Parse coverage from JSON using jq (more reliable than text parsing)
          overall=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          evaluator=$(jq -r '.data[0].files[] | select(.filename | endswith("evaluator.rs")) | .summary.lines.percent' coverage.json)
          hook=$(jq -r '.data[0].files[] | select(.filename | endswith("hook.rs")) | .summary.lines.percent' coverage.json)

          echo "Coverage thresholds:"
          echo "  overall >= ${OVERALL_MIN}%"
          echo "  src/evaluator.rs >= ${EVALUATOR_MIN}%"
          echo "  src/hook.rs >= ${HOOK_MIN}%"
          echo ""
          echo "Observed coverage:"
          printf "  overall=%.2f%%\n" "$overall"
          printf "  src/evaluator.rs=%.2f%%\n" "$evaluator"
          printf "  src/hook.rs=%.2f%%\n" "$hook"

          echo "coverage_overall=${overall}" >> "$GITHUB_OUTPUT"
          echo "coverage_evaluator=${evaluator}" >> "$GITHUB_OUTPUT"
          echo "coverage_hook=${hook}" >> "$GITHUB_OUTPUT"

          failures=0
          if [ -z "$overall" ] || [ "$overall" = "null" ]; then
            echo "::error::Failed to parse overall coverage from coverage.json"
            failures=$((failures + 1))
          elif awk -v v="$overall" -v min="$OVERALL_MIN" 'BEGIN{exit !(v+0 < min+0)}'; then
            printf "::error::Overall coverage %.2f%% is below ${OVERALL_MIN}%%\n" "$overall"
            failures=$((failures + 1))
          fi

          if [ -z "$evaluator" ] || [ "$evaluator" = "null" ]; then
            echo "::error::Failed to parse src/evaluator.rs coverage from coverage.json"
            failures=$((failures + 1))
          elif awk -v v="$evaluator" -v min="$EVALUATOR_MIN" 'BEGIN{exit !(v+0 < min+0)}'; then
            printf "::error::src/evaluator.rs coverage %.2f%% is below ${EVALUATOR_MIN}%%\n" "$evaluator"
            failures=$((failures + 1))
          fi

          if [ -z "$hook" ] || [ "$hook" = "null" ]; then
            echo "::error::Failed to parse src/hook.rs coverage from coverage.json"
            failures=$((failures + 1))
          elif awk -v v="$hook" -v min="$HOOK_MIN" 'BEGIN{exit !(v+0 < min+0)}'; then
            printf "::error::src/hook.rs coverage %.2f%% is below ${HOOK_MIN}%%\n" "$hook"
            failures=$((failures + 1))
          fi

          if [ "$failures" -gt 0 ]; then
            echo "::error::Coverage thresholds not met (${failures} failure(s))"
            exit 1
          fi

          echo "Coverage thresholds satisfied."

  # Memory leak detection tests
  memory-tests:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-memory-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-memory-

      - name: Run memory tests
        id: memory_tests
        run: |
          echo "=== DCG Memory Leak Tests ===" | tee memory-output.log
          echo "Timestamp: $(date -Iseconds)" | tee -a memory-output.log
          echo "Runner: ${{ runner.os }}" | tee -a memory-output.log
          echo "Rust: $(rustc --version)" | tee -a memory-output.log
          echo "" | tee -a memory-output.log

          # Get baseline system memory
          echo "=== System Memory Baseline ===" | tee -a memory-output.log
          free -h | tee -a memory-output.log
          echo "" | tee -a memory-output.log

          echo "=== Running Memory Tests ===" | tee -a memory-output.log
          # Memory tests must run sequentially for accurate measurements
          # Release mode for realistic performance characteristics
          if cargo test --test memory_tests --release -- --nocapture --test-threads=1 2>&1 | tee -a memory-output.log; then
            echo "" | tee -a memory-output.log
            echo "=== Memory Tests: ALL PASSED ===" | tee -a memory-output.log
            echo "memory_tests_result=passed" >> $GITHUB_OUTPUT
          else
            echo "" | tee -a memory-output.log
            echo "=== Memory Tests: FAILED ===" | tee -a memory-output.log
            echo "memory_tests_result=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Parse memory metrics
        if: always()
        run: |
          echo "=== Memory Test Metrics ===" | tee -a memory-metrics.log
          echo "" | tee -a memory-metrics.log

          # Extract metrics from test output
          echo "Test Results:" | tee -a memory-metrics.log
          grep -E "^memory_" memory-output.log | tee -a memory-metrics.log || echo "No metrics found" | tee -a memory-metrics.log

          echo "" | tee -a memory-metrics.log
          echo "Growth Summary:" | tee -a memory-metrics.log
          grep -E "final.*growth" memory-output.log | tee -a memory-metrics.log || echo "No growth data" | tee -a memory-metrics.log

          echo "" | tee -a memory-metrics.log
          echo "Pass/Fail:" | tee -a memory-metrics.log
          grep -E "(PASSED|FAILED|panicked)" memory-output.log | tee -a memory-metrics.log || echo "No status found" | tee -a memory-metrics.log

      - name: Memory test summary
        if: always()
        run: |
          echo "## Memory Leak Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Result badge
          if grep -q "ALL PASSED" memory-output.log; then
            echo "**Result:** ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result:** ❌ Tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Metrics table
          echo "### Memory Growth by Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Final Growth | Limit | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------------|-------|--------|" >> $GITHUB_STEP_SUMMARY

          # Parse and format metrics
          grep -E "final.*growth" memory-output.log | while read line; do
            test_name=$(echo "$line" | grep -oP "^[^:]+")
            growth=$(echo "$line" | grep -oP "growth: \\K[0-9]+ KB" || echo "?")
            limit=$(echo "$line" | grep -oP "limit: \\K[0-9]+ KB" || echo "?")
            if echo "$line" | grep -q "PASSED"; then
              status="✅"
            else
              status="❌"
            fi
            echo "| $test_name | $growth | $limit | $status |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Full Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 memory-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload memory test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-test-output
          path: |
            memory-output.log
            memory-metrics.log
          retention-days: 14

  # Performance benchmark enforcement (push to main only)
  # Runs benchmarks and checks against performance budgets defined in src/perf.rs
  benchmarks:
    runs-on: ubuntu-latest
    needs: check
    # Only run on push to main, not on PRs (benchmarks are noisy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks
        run: |
          # Run benchmarks and capture output
          cargo bench --bench heredoc_perf -- --noplot 2>&1 | tee benchmark_output.txt
          cargo bench --bench codex_deny -- --noplot 2>&1 | tee -a benchmark_output.txt
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(tier|pack|core|shell|language|full|hook)" benchmark_output.txt | head -50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check performance budgets
        run: |
          # Extract timing summaries and check against budgets
          # Budgets from src/perf.rs:
          # - Quick reject: 50μs panic
          # - Fast path: 500μs panic
          # - Pattern match: 1ms panic
          # - Heredoc extract: 2ms panic
          # - Full heredoc pipeline: 20ms panic
          # - Hook evaluation deadline: 1000ms (exhaustion is indeterminate, never a silent allow)
          echo "## Performance Budget Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PANIC_VIOLATIONS=0

          # Check for any results exceeding 1s (major benchmark sanity cap)
          if grep -E "time:.*\[.*[0-9]+\.[0-9]+ s" benchmark_output.txt; then
            echo "::error::Some benchmarks exceeded 1 second - major regression detected"
            PANIC_VIOLATIONS=$((PANIC_VIOLATIONS + 1))
          fi

          # Check full_pipeline benchmarks (budget: 20ms panic)
          if grep -A1 "full_pipeline" benchmark_output.txt | grep -E "time:.*\[.*([2-9][0-9]\.[0-9]+ ms|[0-9]{3,}\.[0-9]+ ms)"; then
            echo "::warning::Full heredoc pipeline benchmark exceeds 20ms budget"
            PANIC_VIOLATIONS=$((PANIC_VIOLATIONS + 1))
          fi

          if [ $PANIC_VIOLATIONS -gt 0 ]; then
            echo "::error::$PANIC_VIOLATIONS performance budget violations detected"
            echo "Budget violations: $PANIC_VIOLATIONS" >> $GITHUB_STEP_SUMMARY
            # For now, warn but don't fail (benchmarks can be noisy in CI)
            # exit 1
          else
            echo "All benchmarks within budget" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark_output.txt
          retention-days: 30

  # End-to-end shell script tests
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Run E2E tests
        id: e2e
        run: |
          set +e
          set -o pipefail

          mkdir -p e2e-artifacts
          ./scripts/e2e_test.sh --verbose --binary target/release/dcg --json --artifacts e2e-artifacts | tee e2e_output.json >/dev/null
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          # Extract summary from JSON output
          if jq -e '.summary' e2e_output.json >/dev/null 2>&1; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '.summary' e2e_output.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            FAILED=$(jq -r '.summary.failed // 0' e2e_output.json 2>/dev/null || echo "0")
            if [ "$FAILED" != "0" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### First Failure" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              jq -r '.tests[] | select(.result == "fail") | "\(.id): \(.name)\n\n\(.output // "")"' e2e_output.json | head -n 40 >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 e2e_output.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            e2e_output.json
            e2e-artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Check E2E result
        if: steps.e2e.outputs.exit_code != '0'
        run: |
          echo "::error::E2E suite failed (exit code ${{ steps.e2e.outputs.exit_code }}). See the 'e2e-artifacts' artifact and the step summary for the first failure."
          exit 1

  # Bats install/uninstall/agent-config tests
  bats:
