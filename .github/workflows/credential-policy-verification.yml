name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve source and the unmodified failure evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/removal-inputs"
          git rev-parse HEAD > "$RUNNER_TEMP/removal-inputs/revision.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/removal-inputs/source.tar.gz" HEAD
          gh run download 35680436655 --repo "$GITHUB_REPOSITORY" \
            --name removal-policy-verification-8b30604946e210926f8c66a7384b43fd55543c41 \
            --dir "$RUNNER_TEMP/removal-inputs/prior"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: removal-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/removal-inputs/
          if-no-files-found: error
