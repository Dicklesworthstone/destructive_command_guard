name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-policy-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install the pinned parser generator
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/tree-sitter/tree-sitter/releases/download/v0.25.10/tree-sitter-linux-x64.gz \
            --output "$RUNNER_TEMP/tree-sitter.gz"
          echo "8283ddba69253c698f6e987ba0e2f9285e079c8db4d36ebe1394b5bb3a0ebdfd  $RUNNER_TEMP/tree-sitter.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/tree-sitter.gz" > "$RUNNER_TEMP/tree-sitter"
          chmod +x "$RUNNER_TEMP/tree-sitter"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tree-sitter" --version

      - name: Capture the original parser behavior without executing candidates
        shell: bash
        run: |
          mkdir -p target/here-string-verification
          cat > "$RUNNER_TEMP/here-string-input.sh" <<'SHELL'
          python3 0<<< 'pass'
          python3 </dev/null <<< 'pass'
          SHELL
          cd vendor/tree-sitter-bash
          # Parsing only: neither the shell fixture nor its Python is executed.
          tree-sitter parse "$RUNNER_TEMP/here-string-input.sh" \
            > "$GITHUB_WORKSPACE/target/here-string-verification/parser-before.log" 2>&1 || true
          cat "$GITHUB_WORKSPACE/target/here-string-verification/parser-before.log"

      - name: Apply the reviewed parser and regression repair
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/here-string.patch" <<'PATCH'
          diff --git a/Cargo.toml b/Cargo.toml
          --- a/Cargo.toml
          +++ b/Cargo.toml
          @@ -111,3 +111,4 @@
          -# #442: the upstream scanner passes Unicode code points to byte-only isdigit.
          -# Keep the grammar unchanged; vendor only the two ASCII digit-loop fixes.
          +# #442/#461: retain the Unicode scanner safety fixes and repair explicit
          +# stdin descriptors and mixed file/here-string redirection sequences.
          +# Generated parser artifacts are checked in alongside the patched grammar.
           tree-sitter-bash = { path = "vendor/tree-sitter-bash" }
          diff --git a/vendor/tree-sitter-bash/src/scanner.c b/vendor/tree-sitter-bash/src/scanner.c
          --- a/vendor/tree-sitter-bash/src/scanner.c
          +++ b/vendor/tree-sitter-bash/src/scanner.c
          @@ -571,7 +571,10 @@
                   // no '*', '@', '?', '-', '$', '0', '_'
          +        // A leading zero is also a valid redirection descriptor (#461).
          +        // Leave it for the numeric scanner when that token is admissible;
          +        // consuming it here turns 0<<< into an argv word plus a redirect.
                   if (!valid_symbols[EXPANSION_WORD] &&
                       (lexer->lookahead == '*' || lexer->lookahead == '@' || lexer->lookahead == '?' || lexer->lookahead == '-' ||
          -             lexer->lookahead == '0' || lexer->lookahead == '_')) {
          +             (lexer->lookahead == '0' && !valid_symbols[FILE_DESCRIPTOR]) || lexer->lookahead == '_')) {
                       lexer->mark_end(lexer);
                       advance(lexer);
          diff --git a/vendor/tree-sitter-bash/grammar.js b/vendor/tree-sitter-bash/grammar.js
          --- a/vendor/tree-sitter-bash/grammar.js
          +++ b/vendor/tree-sitter-bash/grammar.js
          @@ -181,7 +181,9 @@
                     seq(
                       field("body", $._statement),
          -            field("redirect", choice(repeat1(choice($.file_redirect, $.heredoc_redirect)))),
          +            // Preserve the same receiver after a file redirect (#461).
          +            // A later here-string is not a separate redirected statement.
          +            field("redirect", repeat1(choice($._redirect, $.heredoc_redirect))),
                     ),
                     seq(field("body", choice($.if_statement, $.while_statement)), $.herestring_redirect),
          diff --git a/src/packs/core/credential_files/embedded.rs b/src/packs/core/credential_files/embedded.rs
          --- a/src/packs/core/credential_files/embedded.rs
          +++ b/src/packs/core/credential_files/embedded.rs
          @@ -1078,6 +1078,85 @@
           mod here_string_tests {
               use super::*;
           
          +    #[test]
          +    fn here_string_parser_preserves_descriptors_and_receiver_argv() {
          +        for descriptor in ["0", "00", "3"] {
          +            let command = format!("python3 {descriptor}<<< 'pass'");
          +            let ast = AstGrep::new(&command, SupportLang::Bash);
          +            let root = ast.root();
          +            assert!(!root.dfs().any(|node| node.kind() == "ERROR"), "{command}");
          +            let receiver = root.dfs().find(|node| node.kind() == "command").unwrap();
          +            assert_eq!(command_words(&receiver), Some(vec!["python3".to_string()]), "{command}");
          +            let redirect = root.dfs().find(|node| node.kind() == "herestring_redirect").unwrap();
          +            assert_eq!(redirect.field("descriptor").map(|node| node.text().into_owned()), Some(descriptor.to_string()), "{command}");
          +        }
          +    }
          +
          +    #[test]
          +    fn here_string_parser_preserves_mixed_redirection_order() {
          +        for command in [
          +            "python3 0<<< 'pass'",
          +            "python3 00<<< 'pass'",
          +            "python3 </dev/null <<< 'pass'",
          +            "python3 0</dev/null 0<<< 'pass'",
          +            "python3 <<< 'old' </dev/null 0<<< 'pass'",
          +            "python3 2>/dev/null 0<<< 'pass'",
          +        ] {
          +            let ast = AstGrep::new(command, SupportLang::Bash);
          +            let root = ast.root();
          +            assert!(!root.dfs().any(|node| node.kind() == "ERROR"), "{command}");
          +            let mut commands = root.dfs().filter(|node| node.kind() == "command");
          +            let receiver = commands.next().expect(command);
          +            assert!(commands.next().is_none(), "{command}");
          +            assert_eq!(command_words(&receiver), Some(vec!["python3".to_string()]), "{command}");
          +            let (code, span) = here_string_source(&receiver).expect(command);
          +            assert_eq!(code, "pass", "{command}");
          +            assert_eq!(&command[span], "'pass'", "{command}");
          +        }
          +    }
          +
          +    #[test]
          +    fn explicit_stdin_does_not_consume_real_arguments_or_other_descriptors() {
          +        for command in [
          +            "python3 0 <<< \"open('/etc/shadow', 'w')\"",
          +            "python3 '0'<<< \"open('/etc/shadow', 'w')\"",
          +            "python3 \\0<<< \"open('/etc/shadow', 'w')\"",
          +            "python3 3<<< \"open('/etc/shadow', 'w')\"",
          +            "python3 0<<< \"open('/etc/shadow', 'w')\" 0</dev/null",
          +            "python3 0<<< \"open('/etc/shadow', 'w')\" <&-",
          +            "python3 example.py </dev/null 0<<< \"open('/etc/shadow', 'w')\"",
          +        ] {
          +            assert!(classify(command, ShellDialect::Posix).is_none(), "{command}");
          +        }
          +        // The scanner's special-parameter path must still accept $0.
          +        let ast = AstGrep::new("echo \"$0\" \"${0}\" \"$@\"", SupportLang::Bash);
          +        assert!(!ast.root().dfs().any(|node| node.kind() == "ERROR"));
          +    }
          +
          +    #[test]
          +    fn explicit_stdin_obeys_last_redirection_without_borrowing_stdout() {
          +        for command in [
          +            "python3 </dev/null 0<<< \"open('/etc/shadow', 'w')\"",
          +            "python3 0</dev/null <<< \"open('/etc/shadow', 'w')\"",
          +            "python3 <<< 'pass' </dev/null 0<<< \"open('/etc/shadow', 'w')\"",
          +            "python3 0<<< \"open('/etc/shadow', 'w')\" 2>/dev/null",
          +            "python3 3<<< 'pass' 0<<< \"open('/etc/shadow', 'w')\"",
          +            "0<<< \"open('/etc/shadow', 'w')\" python3",
          +        ] {
          +            assert!(classify(command, ShellDialect::Posix).is_some(), "{command}");
          +        }
          +    }
          +
               #[test]
               fn here_strings_bind_to_the_actual_interpreter_argv() {
          @@ -1095,3 +1174,3 @@
          -                        for redirect in ["<<< ", "<<<", "0<<< "] {
          +                        for redirect in ["<<< ", "<<<", "0<<< ", "0<<<", "00<<< "] {
                                       let command = format!("{prefix}{exe}{flag} {redirect}{word}");
                                       let hit = classify(&command, ShellDialect::Posix).expect(&command);
          @@ -1179,5 +1258,9 @@
                   for command in [
                       "python3 <<< \"open('/etc/shadow', 'w')\"",
          +            "python3 0<<< \"open('/etc/shadow', 'w')\"",
          +            "python3 </dev/null <<< \"open('/etc/shadow', 'w')\"",
                       "env ruby - <<< \"File.write('/home/u/.bashrc', 'x')\"",
          +            "env ruby - 0</dev/null 0<<< \"File.write('/home/u/.bashrc', 'x')\"",
                       "node <<< \"require('fs').appendFileSync('/root/.ssh/authorized_keys', 'x')\"",
          +            "node 0<<< \"require('fs').appendFileSync('/root/.ssh/authorized_keys', 'x')\" 2>/dev/null",
          PATCH
          if git apply --reverse --check --recount "$RUNNER_TEMP/here-string.patch"; then
            echo 'Reviewed repair is already present.'
          else
            git apply --check --recount "$RUNNER_TEMP/here-string.patch"
            git apply --recount "$RUNNER_TEMP/here-string.patch"
          fi
          (cd vendor/tree-sitter-bash && tree-sitter generate)
          git diff --check
          git diff --stat

      - name: Activate the repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          cargo fmt --all

      - name: Parser, classifier, and real-entry-point regressions
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          (cd vendor/tree-sitter-bash && tree-sitter parse "$RUNNER_TEMP/here-string-input.sh") \
            | tee target/here-string-verification/parser-after.log
          cargo test --locked --lib credential_files::embedded::here_string_tests \
            2>&1 | tee target/here-string-verification/here-strings.log
          cargo test --locked --lib credential_files \
            2>&1 | tee target/here-string-verification/credential-files.log
          cargo test --locked --test credential_file_embedded_e2e \
            2>&1 | tee target/here-string-verification/embedded-e2e.log
          cargo test --locked --lib scanner_regression_tests \
            2>&1 | tee target/here-string-verification/scanner-regressions.log
          cargo test --locked --test repro_442_vendored_scanner_is_linked \
            2>&1 | tee target/here-string-verification/vendor-linkage.log
          python3 -m unittest discover -s scripts -p test_check_scanner_safety.py -v \
            2>&1 | tee target/here-string-verification/scanner-gate.log
          python3 scripts/check_scanner_safety.py prepare \
            2>&1 | tee target/here-string-verification/scanner-unicode.log

      - name: Check all targets, Clippy, and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee target/here-string-verification/check.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/here-string-verification/clippy.log
          cargo fmt --all --check
          git diff --check

      - name: Publish only the verified repair directly to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes to publish.'
            exit 0
          fi
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              Cargo.toml|src/packs/core/credential_files/embedded.rs|vendor/tree-sitter-bash/grammar.js|vendor/tree-sitter-bash/src/scanner.c|vendor/tree-sitter-bash/src/parser.c|vendor/tree-sitter-bash/src/grammar.json|vendor/tree-sitter-bash/src/node-types.json) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml src/packs/core/credential_files/embedded.rs vendor/tree-sitter-bash/grammar.js vendor/tree-sitter-bash/src/scanner.c vendor/tree-sitter-bash/src/parser.c vendor/tree-sitter-bash/src/grammar.json vendor/tree-sitter-bash/src/node-types.json
          git commit -m 'fix(parser): preserve here-string stdin descriptors and redirection order (#461)' \
            -m 'Keep the existing failing assertions and add descriptor, argv, redirection-order, and public-evaluator regressions. Regenerate the vendored parser. Focused credential and scanner tests, native scanner safety, all-target check, Clippy, and formatting passed before publication.'
          # A concurrent main update rejects this push. Never force or publish
          # an untested rebase over somebody else's work.
          git push origin HEAD:main
          git rev-parse HEAD | tee target/here-string-verification/published-commit.txt

      - name: Complete library regression suite
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib 2>&1 | tee target/here-string-verification/full-lib.log

      - name: Retain diagnostics and the exact source diff
        if: always()
        shell: bash
        run: |
          mkdir -p target/here-string-verification
          git diff --binary > target/here-string-verification/unpublished.patch
          git show --stat --oneline HEAD > target/here-string-verification/head.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: here-string-verification-${{ github.sha }}
          path: target/here-string-verification/
          if-no-files-found: error
