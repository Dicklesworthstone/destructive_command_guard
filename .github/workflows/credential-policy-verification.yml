name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-php-perl-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
      REGRESSION_PATCH: 6dd697f751e6e6fdd7453a6f8b4e4fce95374ad9
      IMPLEMENTATION_PATCH: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate the repository toolchain
        run: |
          set -euo pipefail
          mkdir -p target/php-perl-verification
          git rev-parse HEAD > target/php-perl-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: credential-php-perl-verification
          cache-on-failure: true

      - name: Apply exact reviewed regression patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$REGRESSION_PATCH" --jq .content | base64 --decode > "$RUNNER_TEMP/regressions.patch"
          test "$(git hash-object "$RUNNER_TEMP/regressions.patch")" = "$REGRESSION_PATCH"
          git apply --recount --check "$RUNNER_TEMP/regressions.patch"
          git apply --recount "$RUNNER_TEMP/regressions.patch"
          cp "$RUNNER_TEMP/regressions.patch" target/php-perl-verification/

      - name: Demonstrate the failure on unchanged production
        run: |
          set -euo pipefail
          set +e
          cargo test --locked --test credential_file_embedded_e2e php_perl_issue_466_reported_writes_reach_real_entry_points -- --exact 2>&1 | tee target/php-perl-verification/baseline-writes.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 101
          grep -F 'test php_perl_issue_466_reported_writes_reach_real_entry_points ... FAILED' target/php-perl-verification/baseline-writes.log
          grep -F 'test result: FAILED. 0 passed; 1 failed;' target/php-perl-verification/baseline-writes.log
          cargo test --locked --test credential_file_embedded_e2e php_perl_issue_466_benign_controls_reach_real_entry_points -- --exact 2>&1 | tee target/php-perl-verification/baseline-benign.log

      - name: Apply exact reviewed implementation
        if: env.IMPLEMENTATION_PATCH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$IMPLEMENTATION_PATCH" --jq .content | base64 --decode > "$RUNNER_TEMP/implementation.patch"
          test "$(git hash-object "$RUNNER_TEMP/implementation.patch")" = "$IMPLEMENTATION_PATCH"
          cp "$RUNNER_TEMP/implementation.patch" target/php-perl-verification/
          git apply --recount --check "$RUNNER_TEMP/implementation.patch"
          git apply --recount "$RUNNER_TEMP/implementation.patch"
          rustfmt --edition 2024 --config skip_children=true src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/php.rs src/packs/core/credential_files/embedded/perl.rs tests/credential_file_embedded_e2e.rs
          git diff --check

      - name: Verify complete implementation before publication
        if: env.IMPLEMENTATION_PATCH != ''
        run: |
          set -euo pipefail
          cargo test --locked --lib credential_files 2>&1 | tee target/php-perl-verification/classifiers.log
          cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee target/php-perl-verification/embedded-e2e.log
          cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee target/php-perl-verification/transfer-e2e.log
          cargo test --locked --lib -- --test-threads=1 2>&1 | tee target/php-perl-verification/full-lib.log
          cargo check --locked --all-targets 2>&1 | tee target/php-perl-verification/check.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/php-perl-verification/clippy.log
          cargo fmt --all --check 2>&1 | tee target/php-perl-verification/fmt.log
          git diff --check

      - name: Publish verified source directly to main
        if: env.IMPLEMENTATION_PATCH != ''
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/php.rs src/packs/core/credential_files/embedded/perl.rs tests/credential_file_embedded_e2e.rs
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/php.rs|src/packs/core/credential_files/embedded/perl.rs|tests/credential_file_embedded_e2e.rs) ;;
              *) echo "Unexpected source path: $path"; exit 1 ;;
            esac
          done
          git commit -m 'feat(core): guard PHP and bounded Perl protected-file writes (#466)'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              cargo test --locked --lib credential_files
              cargo test --locked --test credential_file_embedded_e2e
              cargo test --locked --test credential_file_transfer_e2e
              cargo test --locked --lib -- --test-threads=1
              cargo check --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              cargo fmt --all --check
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD > target/php-perl-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main kept advancing; reviewed source retained without force push'
          exit 1

      - name: Retain source and diagnostics
        if: always()
        run: |
          mkdir -p target/php-perl-verification
          git diff --binary > target/php-perl-verification/unpublished.patch
          tar -czf target/php-perl-verification/source.tar.gz src/packs/core/credential_files tests/credential_file_embedded_e2e.rs Cargo.toml rust-toolchain.toml

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-perl-verification-${{ github.sha }}
          path: target/php-perl-verification/
          if-no-files-found: error
