name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-policy-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate the repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/multi-rule-verification
          git rev-parse HEAD > target/multi-rule-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retrieve the exact reviewed patch and failing control
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 35645576314 --repo "$GITHUB_REPOSITORY" \
            --name multi-rule-verification-04f487b237469c10aad2922c3bfe5a416ce8be6b \
            --dir "$RUNNER_TEMP/reviewed-multi-rule"
          echo "d1e9b96d8927d17358e91984871e8f08a44d4bba3bb418074357459d5b9b78fd  $RUNNER_TEMP/reviewed-multi-rule/unpublished.patch" | sha256sum --check
          cp "$RUNNER_TEMP/reviewed-multi-rule/baseline.log" target/multi-rule-verification/baseline.log
          grep -F 'test result: FAILED' target/multi-rule-verification/baseline.log
          grep -F 'cross_rule_grants_survive_every_delivery_and_extraction_mode ... FAILED' target/multi-rule-verification/baseline.log
          # The evaluator is reconciled explicitly below. Keep its concurrent
          # timeout/data-sink/diagnostic improvements rather than reverting them.
          git apply --check --exclude=src/evaluator.rs "$RUNNER_TEMP/reviewed-multi-rule/unpublished.patch"
          git apply --exclude=src/evaluator.rs "$RUNNER_TEMP/reviewed-multi-rule/unpublished.patch"

      - name: Apply the reconciled evaluator and unchanged test semantics
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/reconciled.patch" <<'PATCH'
          diff --git a/src/evaluator.rs b/src/evaluator.rs
          --- a/src/evaluator.rs
          +++ b/src/evaluator.rs
          @@ -23404,13 +23404,11 @@
                   // outranks `redirect-truncate-root-home` and the #390 absent-file
                   // carve-out (which only stands that one rule down). Nested
                   // substitution ranges are evaluated as their own segments.
          -        let mut credential_span_base = segment_start;
          -        let mut credential_hit =
          -            crate::packs::core::credential_files::classify_credential_file_write(
          -                mask_nested_segment_ranges(dialect_segment, segment_start, &nested_segment_ranges)
          -                    .as_ref(),
          -                shell_dialect,
          -            );
          +        let credential_hit = crate::packs::core::credential_files::classify_credential_file_write(
          +            mask_nested_segment_ranges(dialect_segment, segment_start, &nested_segment_ranges)
          +                .as_ref(),
          +            shell_dialect,
          +        );
                   // Embedded interpreter code is delivered out-of-band, so no single
                   // segment holds both the interpreter and its code: a heredoc body is
                   // split off by the newlines that separate commands, a pipeline puts the
          @@ -23419,22 +23417,25 @@
                   // for any of those — only for inline `-c`/`-e`, where the code is inside
                   // the segment. Measured before this: `python3 -c "open('/etc/shadow',
                   // 'a').write(k)"` denied while the same code in a heredoc, a pipe, or a
          -        // here-string was allowed (#461). Scan the whole command once, and only
          -        // when no segment produced a hit, so segment attribution still wins.
          -        if credential_hit.is_none() && !embedded_credential_scanned {
          +        // here-string was allowed (#461). Inspect original source once, even
          +        // when a segment found a write: allowing that rule must not hide a
          +        // second rule on the same rename or in another interpreter command.
          +        let embedded_hits = if embedded_credential_scanned {
          +            Vec::new()
          +        } else {
                       embedded_credential_scanned = true;
          -            credential_hit =
          -                crate::packs::core::credential_files::classify_embedded_credential_file_write(
          -                    command_for_packs,
          -                    shell_dialect,
          -                );
          -            if credential_hit.is_some() {
          -                // The span is already in whole-command coordinates, the same
          -                // space `segment_start` offsets into, so the base is zero.
          -                credential_span_base = 0;
          -            }
          -        }
          -        if let Some(hit) = credential_hit {
          +            crate::packs::core::credential_files::classify_embedded_credential_file_writes(
          +                original_command,
          +                shell_dialect,
          +            )
          +        };
          +        // Segment attribution keeps precedence. Embedded spans already refer
          +        // to the original command, not its normalized or sanitized view.
          +        for (hit, credential_span_base, span_offset) in credential_hit
          +            .into_iter()
          +            .map(|hit| (hit, segment_start, normalized_offset))
          +            .chain(embedded_hits.into_iter().map(|hit| (hit, 0, Some(0))))
          +        {
                       // The hit names its own rule: `.git/` writes deny under
                       // `git-internals-write` so allowing one does not also allow a
                       // write to `~/.ssh/authorized_keys` (#457).
          @@ -23445,7 +23446,7 @@
                           start: hit.span.start + credential_span_base,
                           end: hit.span.end + credential_span_base,
                       };
          -            let mapped_span = map_span_with_offset(span, normalized_offset, original_len);
          +            let mapped_span = map_span_with_offset(span, span_offset, original_len);
                       let preview = mapped_span
                           .as_ref()
                           .map(|span| extract_match_preview(original_command, span));
          @@ -25461,7 +25462,7 @@
                   // Cheap, high-signal fallback before the expensive AST pass. If the
                   // hook is already close to its evaluation deadline, this keeps obvious
                   // catastrophic language-library deletes on the direct denial path.
          -        if let Some(m) =
          +        for m in
                       crate::ast_matcher::scan_filesystem_sink_fallback(&content.content, content.language)
                   {
                       if m.severity.blocks_by_default() {
          @@ -38448,6 +38448,59 @@
                       }
                   }
           
          +        #[test]
          +        fn extraction_backstop_applies_each_rule_grant_independently_461() {
          +            let settings = heredoc_config(true, true);
          +            let compiled = default_compiled_overrides();
          +            for (allowed, denied) in [
          +                ("credential-file-write", "git-internals-write"),
          +                ("git-internals-write", "credential-file-write"),
          +            ] {
          +                let directory = tempfile::tempdir().unwrap();
          +                let path = directory.path().join("allowlist.toml");
          +                fs::write(&path, format!(
          +                    "[[allow]]\nrule = \"core.filesystem:{allowed}\"\nreason = \"one endpoint only\"\n"
          +                )).unwrap();
          +                let allowlists = LayeredAllowlist::load_from_paths(Some(path), None, None);
          +                assert!(
          +                    allowlists
          +                        .match_rule_at_path("core.filesystem", allowed, None)
          +                        .is_some()
          +                );
          +                let context = HeredocEvaluationContext {
          +                    allowlists: &allowlists,
          +                    heredoc_settings: &settings,
          +                    project_path: None,
          +                    deadline: None,
          +                    enabled_keywords: &[],
          +                    ordered_packs: &[],
          +                    keyword_index: None,
          +                    compiled_overrides: &compiled,
          +                    allow_once_audit: None,
          +                    shell_dialect: ShellDialect::Posix,
          +                    nested_command_depth: 0,
          +                    inherited_automated_stdin: false,
          +                };
          +                for command in [
          +                    "python3 <<'PY'\nimport os; os.replace('.git/config', '.bashrc')\nPY",
          +                    "python3 <<'PY'\nimport os; os.replace('.bashrc', '.git/config')\nPY",
          +                    "ruby <<'RB'\nFile.rename('.git/config', '.bashrc')\nRB",
          +                    "node <<'JS'\nrequire('fs').renameSync('.bashrc', '.git/config')\nJS",
          +                ] {
          +                    // Call the backstop directly: the core-pack scan must not
          +                    // rescue a broken fallback and make this assertion pass.
          +                    let mut grant = None;
          +                    let result = check_credential_write_fallback(command, context, &mut grant)
          +                        .expect("the other endpoint remains protected");
          +                    assert!(result.is_denied(), "{command}: {result:?}");
          +                    assert_eq!(
          +                        result.pattern_info.unwrap().pattern_name.as_deref(),
          +                        Some(denied)
          +                    );
          +                }
          +            }
          +        }
          +
                   #[test]
                   fn parse_failure_uses_bounded_destructive_fallback() {
                       let settings = heredoc_config(true, true);
          diff --git a/src/packs/core/credential_files/embedded/tests.rs b/src/packs/core/credential_files/embedded/tests.rs
          --- a/src/packs/core/credential_files/embedded/tests.rs
          +++ b/src/packs/core/credential_files/embedded/tests.rs
          @@ -1,7 +1,9 @@
           use super::*;
           
           fn denied(code: &str, language: Language) -> bool {
          -    inspect(code, language, 0..code.len()).is_some()
          +    let mut hits = Vec::new();
          +    inspect(code, language, 0..code.len(), &mut hits);
          +    !hits.is_empty()
           }
           
           #[test]
          diff --git a/tests/credential_file_transfer_e2e.rs b/tests/credential_file_transfer_e2e.rs
          --- a/tests/credential_file_transfer_e2e.rs
          +++ b/tests/credential_file_transfer_e2e.rs
          @@ -386,6 +386,8 @@
           #[test]
           fn cross_rule_grants_survive_every_delivery_and_extraction_mode() {
          +    use std::fmt::Write as _;
          +
               for settings in [
                   "[heredoc]\nenabled = true\ntimeout_ms = 5000\n",
                   "[heredoc]\nenabled = true\ntimeout_ms = 0\n",
          @@ -402,9 +404,12 @@
                       } else {
                           vec![allowed]
                       };
          -            let grants = rules.iter().map(|rule| format!(
          -                "[[allow]]\nrule = \"core.filesystem:{rule}\"\nreason = \"reviewed endpoint\"\n"
          -            )).collect::<String>();
          +            let mut grants = String::new();
          +            for rule in &rules {
          +                writeln!(grants, "[[allow]]\nrule = \"core.filesystem:{rule}\"\nreason = \"reviewed endpoint\"")
          +                    .expect("write rule grant");
          +            }
                       fs::write(home.path().join("xdg/dcg/allowlist.toml"), grants).unwrap();
                       for rule in rules {
                           let target = if rule == "credential-file-write" {
          PATCH
          git apply --check --recount "$RUNNER_TEMP/reconciled.patch"
          git apply --recount "$RUNNER_TEMP/reconciled.patch"
          cargo fmt --all
          git diff --check
          git diff --stat

      - name: Verify and publish only passing source directly to main
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local label="$1"
            cargo test --locked --lib credential_files 2>&1 | tee "target/multi-rule-verification/$label-credential-files.log"
            cargo test --locked --lib ast_matcher::tests 2>&1 | tee "target/multi-rule-verification/$label-ast-policy.log"
            cargo test --locked --lib extraction_backstop_applies_each_rule_grant_independently_461 2>&1 | tee "target/multi-rule-verification/$label-fallback.log"
            cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee "target/multi-rule-verification/$label-transfer-e2e.log"
            cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee "target/multi-rule-verification/$label-embedded-e2e.log"
            cargo test --locked --test repro_459_argv_split_spawns 2>&1 | tee "target/multi-rule-verification/$label-argv-spawns.log"
            cargo test --locked --test repro_442_source_modules_are_declared 2>&1 | tee "target/multi-rule-verification/$label-source-modules.log"
            cargo test --locked --lib 2>&1 | tee "target/multi-rule-verification/$label-full-lib.log"
            cargo check --locked --all-targets 2>&1 | tee "target/multi-rule-verification/$label-check.log"
            cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "target/multi-rule-verification/$label-clippy.log"
            cargo fmt --all --check
            git diff --check
          }
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/ast_matcher.rs|src/evaluator.rs|src/packs/core/credential_files.rs|src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/tests.rs|src/packs/core/credential_files/embedded/transfers.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          verify initial
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ast_matcher.rs src/evaluator.rs src/packs/core/credential_files.rs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'fix(core): retain independent protected-write findings through allowlists (#461)' -m 'Preserve both effects of a rename and all command-level and early-source rule families. Keep the concurrently improved extraction fallback and verify it directly. The new end-to-end control failed before repair; focused regressions, complete library tests, all-target check, Clippy, and formatting passed before publication.'
          git rev-parse HEAD > target/multi-rule-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              verify "merged-$attempt"
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/multi-rule-verification/published-revision.txt
              exit 0
            fi
          done
          echo '::error::main kept advancing; the verified patch is retained without any force-push'
          exit 1

      - name: Retain exact diagnostics and source
        if: always()
        shell: bash
        run: |
          mkdir -p target/multi-rule-verification
          base=$(cat target/multi-rule-verification/base-revision.txt)
          git diff --binary > target/multi-rule-verification/unpublished.patch
          git diff --binary "$base" -- src/ast_matcher.rs src/evaluator.rs src/packs/core/credential_files.rs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs > target/multi-rule-verification/reviewed.patch
          git show --stat --oneline HEAD > target/multi-rule-verification/head.txt
          tar -czf target/multi-rule-verification/repaired-source.tar.gz src/ast_matcher.rs src/evaluator.rs src/packs/core/credential_files.rs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-rule-verification-${{ github.sha }}
          path: target/multi-rule-verification/
          if-no-files-found: error
