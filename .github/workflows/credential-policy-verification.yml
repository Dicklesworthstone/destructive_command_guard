name: Credential policy verification

on:
  push:
    branches: [main]
    paths: [.github/workflows/credential-policy-verification.yml]
  workflow_dispatch:

concurrency:
  group: credential-php-perl-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
      HARDENING_PATCH: 13c8e5da8d59f77fd3a83fac3f6a31e594ba3469
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate the repository toolchain
        run: |
          set -euo pipefail
          mkdir -p target/php-perl-verification
          git rev-parse HEAD > target/php-perl-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: credential-php-perl-verification
          cache-on-failure: true
      - name: Apply the reviewed bounded-fallback safeguards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee target/php-perl-verification/patch-application.log) 2>&1
          test "$(git rev-parse HEAD:src/packs/core/credential_files/embedded/perl.rs)" = 471a775bf65dc882840eb67989871ed4c91ec05c
          test "$(git rev-parse HEAD:tests/credential_file_embedded_e2e.rs)" = 004f3ccd149e9f75176b76e227a79f8254991ec8
          patch=target/php-perl-verification/hardening.patch
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$HARDENING_PATCH" --jq .content | base64 --decode > "$patch"
          test "$(git hash-object "$patch")" = "$HARDENING_PATCH"
          git apply --check "$patch"
          git apply "$patch"
          rustfmt --edition 2024 --config skip_children=true src/packs/core/credential_files/embedded/perl.rs tests/credential_file_embedded_e2e.rs
          git diff --check
      - name: Protected-file unit regressions
        run: |
          set -euo pipefail
          cargo test --locked --lib credential_files 2>&1 | tee target/php-perl-verification/classifiers.log
      - name: Real hook and CLI regressions
        run: |
          set -euo pipefail
          cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee target/php-perl-verification/embedded-e2e.log
          cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee target/php-perl-verification/transfer-e2e.log
      - name: Complete library tests
        run: |
          set -euo pipefail
          cargo test --locked --lib -- --test-threads=1 2>&1 | tee target/php-perl-verification/full-lib.log
      - name: Check all targets
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee target/php-perl-verification/check.log
      - name: Strict Clippy for all targets
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/php-perl-verification/clippy.log
      - name: Formatting and whitespace
        run: |
          set -euo pipefail
          cargo fmt --all --check 2>&1 | tee target/php-perl-verification/fmt.log
          git diff --check
      - name: Publish verified safeguards directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded/perl.rs tests/credential_file_embedded_e2e.rs
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded/perl.rs|tests/credential_file_embedded_e2e.rs) ;;
              *) echo "Unexpected source path: $path"; exit 1 ;;
            esac
          done
          git commit -m 'fix(core): harden Perl fallback bounds, quoted data, and truncation'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              cargo test --locked --lib credential_files
              cargo test --locked --test credential_file_embedded_e2e
              cargo test --locked --test credential_file_transfer_e2e
              cargo test --locked --lib -- --test-threads=1
              cargo check --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              cargo fmt --all --check
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD > target/php-perl-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main kept advancing; reviewed source retained without force push'
          exit 1
      - name: Retain source and diagnostics
        if: always()
        run: |
          mkdir -p target/php-perl-verification
          git diff --binary > target/php-perl-verification/unpublished.patch
          tar -czf target/php-perl-verification/source.tar.gz src/packs/core/credential_files tests/credential_file_embedded_e2e.rs Cargo.toml rust-toolchain.toml
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-perl-verification-${{ github.sha }}
          path: target/php-perl-verification/
          if-no-files-found: error
