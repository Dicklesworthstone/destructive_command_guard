name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-open-options-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record inputs and activate the pinned Rust toolchain
        run: |
          set -euo pipefail
          mkdir -p target/open-options-verification
          git rev-parse HEAD > target/open-options-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retrieve the reviewed correction and its regression tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/a111f3c1b221fc820b3fd3ea3bc83c954633ce2e" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/opaque-options.patch"
          test "$(git hash-object "$RUNNER_TEMP/opaque-options.patch")" = a111f3c1b221fc820b3fd3ea3bc83c954633ce2e
          git apply --check --recount "$RUNNER_TEMP/opaque-options.patch"
          git apply --recount --exclude=src/packs/core/credential_files/embedded.rs "$RUNNER_TEMP/opaque-options.patch"

      - name: Reproduce suppression of a known writable open
        run: |
          set -euo pipefail
          set +e
          cargo test --locked --test credential_file_transfer_e2e opaque_ruby_options_cannot_suppress_hook_or_cli_writes -- --exact \
            2>&1 | tee target/open-options-verification/baseline.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 101
          grep -F 'test opaque_ruby_options_cannot_suppress_hook_or_cli_writes ... FAILED' target/open-options-verification/baseline.log
          grep -F 'test result: FAILED. 0 passed; 1 failed;' target/open-options-verification/baseline.log

      - name: Apply and format the source correction
        run: |
          set -euo pipefail
          git apply --check --recount --include=src/packs/core/credential_files/embedded.rs "$RUNNER_TEMP/opaque-options.patch"
          git apply --recount --include=src/packs/core/credential_files/embedded.rs "$RUNNER_TEMP/opaque-options.patch"
          rustfmt --edition 2024 --config skip_children=true \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs
          git diff --check

      - name: Verify and commit the correction directly to main
        run: |
          set -euo pipefail
          verify() {
            local label="$1"
            cargo test --locked --lib credential_files 2>&1 | tee "target/open-options-verification/$label-credential-files.log"
            cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee "target/open-options-verification/$label-transfer-e2e.log"
            cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee "target/open-options-verification/$label-embedded-e2e.log"
            cargo test --locked --lib 2>&1 | tee "target/open-options-verification/$label-full-lib.log"
            cargo check --locked --all-targets 2>&1 | tee "target/open-options-verification/$label-check.log"
            cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "target/open-options-verification/$label-clippy.log"
            cargo fmt --all --check
            git diff --check
          }
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/tests.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          verify initial
          git diff --binary > target/open-options-verification/reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'fix(core): preserve known write effects across opaque Ruby options (#461)' -m 'Unknown option spreads cannot establish read-only or append-only access. Retain prior write effects with uncertainty until a later explicit mode and flags replace them. Keep read-only opens without write evidence, explicit final read/append controls, ordinary destinations and independent Git attribution unchanged. The real hook/CLI regression failed before repair; credential and integration suites, full library tests, all-target check, Clippy and formatting passed before publication.'
          git rev-parse HEAD > target/open-options-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              verify "merged-$attempt"
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/open-options-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main advanced; retaining the correction without a force push'
          exit 1

      - name: Retain source and diagnostics
        if: always()
        run: |
          mkdir -p target/open-options-verification
          git diff --binary > target/open-options-verification/unpublished.patch
          git show --stat --oneline HEAD > target/open-options-verification/head.txt
          tar -czf target/open-options-verification/repaired-source.tar.gz \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-options-verification-${{ github.sha }}
          path: target/open-options-verification/
          if-no-files-found: error
