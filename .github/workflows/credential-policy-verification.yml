name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - tests/credential_file_*.rs
      - tests/repro_442_vendored_scanner_is_linked.rs
      - scripts/*scanner*
      - vendor/tree-sitter-bash/**
  pull_request:
    paths:
      - .github/workflows/credential-policy-verification.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - tests/credential_file_*.rs
      - tests/repro_442_vendored_scanner_is_linked.rs
      - scripts/*scanner*
      - vendor/tree-sitter-bash/**
  workflow_dispatch:

concurrency:
  group: credential-policy-verification-${{ github.ref }}
  cancel-in-progress: true

# Verification must never rewrite a submitted revision or publish source.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check that the shipped parser matches its grammar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/here-string-verification
          # Keep generation reproducible and authenticate the executable.
          curl --fail --location --retry 3 \
            https://github.com/tree-sitter/tree-sitter/releases/download/v0.25.10/tree-sitter-linux-x64.gz \
            --output "$RUNNER_TEMP/tree-sitter.gz"
          echo "8283ddba69253c698f6e987ba0e2f9285e079c8db4d36ebe1394b5bb3a0ebdfd  $RUNNER_TEMP/tree-sitter.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/tree-sitter.gz" > "$RUNNER_TEMP/tree-sitter"
          chmod +x "$RUNNER_TEMP/tree-sitter"
          (cd vendor/tree-sitter-bash && "$RUNNER_TEMP/tree-sitter" generate)
          # Editing grammar.js alone does not alter the parser Cargo compiles.
          git diff --exit-code -- vendor/tree-sitter-bash \
            | tee target/here-string-verification/parser-generation.log

      - name: Activate the repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Here-string parser, receiver, and evaluator regressions
        shell: bash
        run: |
          set -euo pipefail
          # A mistyped filter must not turn the original two red tests into a
          # zero-test success. Four original and four parser regressions exist.
          cargo test --locked --lib credential_files::embedded::here_string_tests -- --list \
            2>&1 | tee target/here-string-verification/discovered-tests.log
          count=$(sed -nE 's/^([0-9]+) tests?,.*/\1/p' target/here-string-verification/discovered-tests.log)
          if [ "${count:-0}" -lt 8 ]; then
            echo '::error::expected at least eight here-string regression tests'
            exit 1
          fi
          cargo test --locked --lib credential_files::embedded::here_string_tests \
            2>&1 | tee target/here-string-verification/here-strings.log

      - name: Credential classifier and hook/CLI coverage
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib credential_files \
            2>&1 | tee target/here-string-verification/credential-files.log
          cargo test --locked --test credential_file_embedded_e2e \
            2>&1 | tee target/here-string-verification/embedded-e2e.log
          cargo test --locked --test credential_file_transfer_e2e \
            2>&1 | tee target/here-string-verification/transfer-e2e.log

      - name: Complete library regression suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib 2>&1 | tee target/here-string-verification/full-lib.log

      - name: Preserve scanner safety and vendored linkage
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib scanner_regression_tests \
            2>&1 | tee target/here-string-verification/scanner-regressions.log
          cargo test --locked --test repro_442_vendored_scanner_is_linked \
            2>&1 | tee target/here-string-verification/vendor-linkage.log
          python3 -m unittest discover -s scripts -p test_check_scanner_safety.py -v \
            2>&1 | tee target/here-string-verification/scanner-gate.log
          python3 scripts/check_scanner_safety.py prepare \
            2>&1 | tee target/here-string-verification/scanner-unicode.log

      - name: Check all targets, Clippy, and formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee target/here-string-verification/check.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/here-string-verification/clippy.log
          cargo fmt --all --check
          git diff --check

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: here-string-verification-${{ github.sha }}
          path: |
            target/here-string-verification/
            target/scanner-safety/*.log
          if-no-files-found: error
