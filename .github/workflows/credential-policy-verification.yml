name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
      - src/packs/core/credential_files.rs
      - src/packs/core/credential_files/**
      - src/ast_matcher.rs
      - src/evaluator.rs
      - src/heredoc.rs
      - tests/credential_file_embedded_e2e.rs
      - tests/credential_file_transfer_e2e.rs
      - tests/repro_440_eval_sink_in_data_heredoc.rs
      - tests/regression_heredoc_masking.rs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  group: credential-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Activate the repository toolchain
        run: |
          set -euo pipefail
          mkdir -p target/credential-policy-verification
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: credential-php-perl-verification
          cache-on-failure: true
      - name: Protected-file unit regressions
        run: |
          set -euo pipefail
          cargo test --locked --lib credential_files 2>&1 | tee target/credential-policy-verification/classifiers.log
      - name: Real hook and CLI regressions
        run: |
          set -euo pipefail
          cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee target/credential-policy-verification/embedded-e2e.log
          cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee target/credential-policy-verification/transfer-e2e.log
      - name: Complete library tests
        run: |
          set -euo pipefail
          cargo test --locked --lib -- --test-threads=1 2>&1 | tee target/credential-policy-verification/full-lib.log
      - name: Check all targets
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee target/credential-policy-verification/check.log
      - name: Strict Clippy for all targets
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/credential-policy-verification/clippy.log
      - name: Formatting and whitespace
        run: |
          set -euo pipefail
          cargo fmt --all --check 2>&1 | tee target/credential-policy-verification/fmt.log
          git diff --check
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: credential-policy-verification-${{ github.sha }}
          path: target/credential-policy-verification/
          if-no-files-found: warn

  heredoc-execution-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-Z threads=1'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the source and activate the pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p target/heredoc-context-verification
          git rev-parse HEAD > target/heredoc-context-verification/revision.txt
          free -h > target/heredoc-context-verification/memory.txt
          df -h . > target/heredoc-context-verification/disk.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: heredoc-context-verification
          cache-on-failure: true
      - name: Reported quoted-data regressions and execution controls
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --no-fail-fast \
            --test repro_440_eval_sink_in_data_heredoc --test regression_heredoc_masking \
            -- --test-threads=1 2>&1 | tee target/heredoc-context-verification/reported.log
      - name: Existing heredoc, subprocess, and protocol regressions
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --no-fail-fast \
            --test repro_heredoc_pipeline_producer_bypass \
            --test repro_398_399_interpreter_shell_sinks --test repro_459_argv_split_spawns \
            --test repro_279_quoted_expansion_substitution \
            --test repro_439_dollar_expansion_hides_heredoc_target \
            --test repro_412_quoted_heredoc_commit_message \
            --test repro_393_heredoc_boundary_data_sink --test repro_329_heredoc_prose_data_sink \
            --test codex_hook_protocol --test agent_hook_output \
            --test repro_330_hook_subcommand_policy_parity \
            -- --test-threads=1 2>&1 | tee target/heredoc-context-verification/existing.log
      - name: Complete serialized library tests
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --locked --lib -- --test-threads=1 2>&1 | tee target/heredoc-context-verification/full-lib.log
      - name: Check all targets
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee target/heredoc-context-verification/check.log
      - name: Strict Clippy for all targets
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/heredoc-context-verification/clippy.log
      - name: Formatting and whitespace
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          cargo fmt --check 2>&1 | tee target/heredoc-context-verification/fmt.log
          git diff --check
      - name: Upload heredoc verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heredoc-context-${{ github.sha }}-${{ github.run_attempt }}
          path: target/heredoc-context-verification/
          if-no-files-found: error
