name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-open-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record inputs and activate the pinned Rust toolchain
        run: |
          set -euo pipefail
          mkdir -p target/open-policy-verification
          git rev-parse HEAD > target/open-policy-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retrieve the reviewed implementation and regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/7e4788280c9d4f437e23379913cc31ee6e5d490b" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/low-level-open.patch"
          test "$(git hash-object "$RUNNER_TEMP/low-level-open.patch")" = 7e4788280c9d4f437e23379913cc31ee6e5d490b
          git apply --check --recount "$RUNNER_TEMP/low-level-open.patch"

      - name: Reproduce both gaps on unchanged production code
        run: |
          set -euo pipefail
          git apply --recount --include=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/low-level-open.patch"
          for test_name in low_level_open_apis_reach_hook_cli_and_stdin ruby_write_data_is_not_an_append_mode_option; do
            set +e
            cargo test --locked --test credential_file_transfer_e2e "$test_name" -- --exact \
              2>&1 | tee "target/open-policy-verification/baseline-$test_name.log"
            result=${PIPESTATUS[0]}
            set -e
            test "$result" -eq 101
            grep -F "test $test_name ... FAILED" "target/open-policy-verification/baseline-$test_name.log"
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "target/open-policy-verification/baseline-$test_name.log"
          done

      - name: Apply and format the reviewed source repair
        run: |
          set -euo pipefail
          git apply --check --recount --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/low-level-open.patch"
          git apply --recount --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/low-level-open.patch"
          rustfmt --edition 2024 --config skip_children=true \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs
          git diff --check

      - name: Verify and commit the complete repair directly to main
        run: |
          set -euo pipefail
          verify() {
            local label="$1"
            cargo test --locked --lib credential_files 2>&1 | tee "target/open-policy-verification/$label-credential-files.log"
            cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee "target/open-policy-verification/$label-transfer-e2e.log"
            cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee "target/open-policy-verification/$label-embedded-e2e.log"
            cargo test --locked --lib 2>&1 | tee "target/open-policy-verification/$label-full-lib.log"
            cargo check --locked --all-targets 2>&1 | tee "target/open-policy-verification/$label-check.log"
            cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "target/open-policy-verification/$label-clippy.log"
            cargo fmt --all --check
            git diff --check
          }
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/tests.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          verify initial
          git diff --binary > target/open-policy-verification/reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'feat(core): protect low-level credential opens with symbolic flags (#461)' -m 'Recognize Python os.open, Node fs.open/openSync and Ruby sysopen/flagged File opens, including proven aliases and constant combinations. Keep platform-specific numeric flags opaque. Truncation overrides append and incomplete flags cannot grant append-only access. Distinguish Ruby write payloads from effective mode options. Preserve reads, unrelated receivers, literal tilde paths and independent credential/git allowlists. Both real-entry-point controls failed before repair; focused and full-library tests, hook/CLI regressions, all-target check, Clippy and formatting passed before publication.'
          git rev-parse HEAD > target/open-policy-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              verify "merged-$attempt"
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/open-policy-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main advanced; retaining the repair without a force push'
          exit 1

      - name: Retain exact source and all diagnostics
        if: always()
        run: |
          mkdir -p target/open-policy-verification
          git diff --binary > target/open-policy-verification/unpublished.patch
          git show --stat --oneline HEAD > target/open-policy-verification/head.txt
          tar -czf target/open-policy-verification/repaired-source.tar.gz \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-policy-verification-${{ github.sha }}
          path: target/open-policy-verification/
          if-no-files-found: error
