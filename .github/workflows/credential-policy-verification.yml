name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-open-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record inputs and activate the pinned Rust toolchain
        run: |
          set -euo pipefail
          mkdir -p target/open-policy-verification
          git rev-parse HEAD > target/open-policy-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retrieve the exact candidate and real failing controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35674729910 --repo "$GITHUB_REPOSITORY" \
            --name open-policy-verification-8911c7d593e4bcaed9bee8b80f3a52f19ca6d257 \
            --dir "$RUNNER_TEMP/reviewed-opens"
          test "$(git hash-object "$RUNNER_TEMP/reviewed-opens/unpublished.patch")" = 8f4b4dd27bbad1b3bb594eb94bfb7485cb49401e
          cp "$RUNNER_TEMP/reviewed-opens/"baseline-*.log target/open-policy-verification/
          cp "$RUNNER_TEMP/reviewed-opens/initial-credential-files.log" target/open-policy-verification/parentheses-before.log
          for test_name in low_level_open_apis_reach_hook_cli_and_stdin ruby_write_data_is_not_an_append_mode_option; do
            grep -F "test $test_name ... FAILED" "target/open-policy-verification/baseline-$test_name.log"
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "target/open-policy-verification/baseline-$test_name.log"
          done
          grep -F 'test result: FAILED. 91 passed; 1 failed;' target/open-policy-verification/parentheses-before.log
          git apply --check "$RUNNER_TEMP/reviewed-opens/unpublished.patch"
          git apply "$RUNNER_TEMP/reviewed-opens/unpublished.patch"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/bcb030c4e1280ef044c6fefb73e2d8eee0be677d" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/ruby-flags-correction.patch"
          test "$(git hash-object "$RUNNER_TEMP/ruby-flags-correction.patch")" = bcb030c4e1280ef044c6fefb73e2d8eee0be677d
          git apply --check "$RUNNER_TEMP/ruby-flags-correction.patch"

      - name: Reproduce the additional Ruby flags-option gap
        run: |
          set -euo pipefail
          git apply --include=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/ruby-flags-correction.patch"
          set +e
          cargo test --locked --test credential_file_transfer_e2e ruby_flags_options_cannot_hide_truncation_from_hook_or_cli -- --exact \
            2>&1 | tee target/open-policy-verification/baseline-ruby-flags-options.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 101
          grep -F 'test ruby_flags_options_cannot_hide_truncation_from_hook_or_cli ... FAILED' target/open-policy-verification/baseline-ruby-flags-options.log
          grep -F 'test result: FAILED. 0 passed; 1 failed;' target/open-policy-verification/baseline-ruby-flags-options.log

      - name: Apply and format the complete source repair
        run: |
          set -euo pipefail
          git apply --check --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/ruby-flags-correction.patch"
          git apply --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/ruby-flags-correction.patch"
          rustfmt --edition 2024 --config skip_children=true \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs
          git diff --check

      - name: Verify and commit the complete repair directly to main
        run: |
          set -euo pipefail
          verify() {
            local label="$1"
            cargo test --locked --lib credential_files 2>&1 | tee "target/open-policy-verification/$label-credential-files.log"
            cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee "target/open-policy-verification/$label-transfer-e2e.log"
            cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee "target/open-policy-verification/$label-embedded-e2e.log"
            cargo test --locked --lib 2>&1 | tee "target/open-policy-verification/$label-full-lib.log"
            cargo check --locked --all-targets 2>&1 | tee "target/open-policy-verification/$label-check.log"
            cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "target/open-policy-verification/$label-clippy.log"
            cargo fmt --all --check
            git diff --check
          }
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/tests.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          verify initial
          git diff --binary > target/open-policy-verification/reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'feat(core): protect low-level credential opens and effective Ruby flags (#461)' -m 'Recognize Python os.open, Node fs.open/openSync and Ruby sysopen/flagged File opens, including proven aliases, constant combinations and single-expression Ruby parentheses. Keep platform-specific numeric flags opaque. Truncation overrides append, including Ruby flags: ORed with mode; incomplete flags cannot grant append-only access. Distinguish Ruby write payloads from effective mode options. Preserve reads, unrelated receivers, literal tilde paths and independent credential/git allowlists. All original failing assertions retained; three real-entry-point controls failed before repair. Focused and full-library tests, hook/CLI regressions, all-target check, Clippy and formatting passed before publication.'
          git rev-parse HEAD > target/open-policy-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              verify "merged-$attempt"
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/open-policy-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main advanced; retaining the repair without a force push'
          exit 1

      - name: Retain exact source and all diagnostics
        if: always()
        run: |
          mkdir -p target/open-policy-verification
          git diff --binary > target/open-policy-verification/unpublished.patch
          git show --stat --oneline HEAD > target/open-policy-verification/head.txt
          tar -czf target/open-policy-verification/repaired-source.tar.gz \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-policy-verification-${{ github.sha }}
          path: target/open-policy-verification/
          if-no-files-found: error
