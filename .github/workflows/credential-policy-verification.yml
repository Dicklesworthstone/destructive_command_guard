name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-removal-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source and activate the pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p target/removal-policy-verification
          git rev-parse HEAD > target/removal-policy-verification/base-revision.txt
          git diff --exit-code cd8d2bec434c9b7c911c93a40429457f40a3eb50 HEAD -- src tests
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retain failures and apply both exact reviewed repairs
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35680436655 --repo "$GITHUB_REPOSITORY" \
            --name removal-policy-verification-8b30604946e210926f8c66a7384b43fd55543c41 \
            --dir "$RUNNER_TEMP/prior-removal"
          cp "$RUNNER_TEMP/prior-removal/"baseline-*.log target/removal-policy-verification/
          cp "$RUNNER_TEMP/prior-removal/transfer-e2e.log" target/removal-policy-verification/ownership-before.log
          for language in python node ruby; do
            grep -F "test ${language}_protected_removals_reach_hook_cli_and_stdin ... FAILED" "target/removal-policy-verification/baseline-$language.log"
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "target/removal-policy-verification/baseline-$language.log"
          done
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/dc00d56d99db23e0a9c62565913843823bf4fed5" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/protected-removals.patch"
          test "$(git hash-object "$RUNNER_TEMP/protected-removals.patch")" = dc00d56d99db23e0a9c62565913843823bf4fed5
          git apply --check "$RUNNER_TEMP/protected-removals.patch"
          git apply "$RUNNER_TEMP/protected-removals.patch"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/86cee7492af236e718578648ae7235a9fdfd96ba" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/ownership.patch.gz"
          test "$(git hash-object "$RUNNER_TEMP/ownership.patch.gz")" = 86cee7492af236e718578648ae7235a9fdfd96ba
          gzip --decompress --stdout "$RUNNER_TEMP/ownership.patch.gz" > "$RUNNER_TEMP/ownership.patch"
          test "$(git hash-object "$RUNNER_TEMP/ownership.patch")" = 919e26cd0b1a386ae46662fc96a347a89df9c541
          git apply --check "$RUNNER_TEMP/ownership.patch"
          git apply "$RUNNER_TEMP/ownership.patch"
          rustfmt --edition 2024 --config skip_children=true \
            src/evaluator.rs src/heredoc.rs \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/transfers.rs \
            tests/credential_file_transfer_e2e.rs
          git diff --check
          git diff --stat
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/evaluator.rs|src/heredoc.rs|src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/transfers.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done

      - name: Source ownership and receiver regressions
        run: |
          set -euo pipefail
          cargo test --locked --lib heredoc::interpreter_word_regressions -- --list \
            2>&1 | tee target/removal-policy-verification/discovered-ownership.log
          grep -F '::complete_quoted_words_keep_source_and_receiver_language: test' target/removal-policy-verification/discovered-ownership.log
          grep -F '::here_string_data_is_not_interpreter_source: test' target/removal-policy-verification/discovered-ownership.log
          grep -F '::python_import_mask_preserves_real_exec_and_outer_shell_commands: test' target/removal-policy-verification/discovered-ownership.log
          cargo test --locked --lib heredoc::interpreter_word_regressions \
            2>&1 | tee target/removal-policy-verification/ownership.log

      - name: Credential classifiers and real entry points
        if: ${{ !cancelled() && steps.repair.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked --lib credential_files \
            2>&1 | tee target/removal-policy-verification/credential-files.log
          cargo test --locked --test credential_file_transfer_e2e -- --list \
            2>&1 | tee target/removal-policy-verification/discovered-transfers.log
          for name in python_protected_removals_reach_hook_cli_and_stdin node_protected_removals_reach_hook_cli_and_stdin ruby_protected_removals_reach_hook_cli_and_stdin protected_removal_rule_grants_do_not_hide_other_targets python_import_binding_is_not_a_shell_unlink_invocation; do
            grep -Fx "$name: test" target/removal-policy-verification/discovered-transfers.log
          done
          cargo test --locked --test credential_file_transfer_e2e \
            2>&1 | tee target/removal-policy-verification/transfer-e2e.log
          cargo test --locked --test credential_file_embedded_e2e \
            2>&1 | tee target/removal-policy-verification/embedded-e2e.log

      - name: Complete library and quality gates
        if: ${{ !cancelled() && steps.repair.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked --lib -- --test-threads=1 \
            2>&1 | tee target/removal-policy-verification/full-lib.log
          cargo test --locked --test repro_442_source_modules_are_declared \
            2>&1 | tee target/removal-policy-verification/source-modules.log
          cargo test --locked --test repro_459_argv_split_spawns \
            2>&1 | tee target/removal-policy-verification/argv-spawns.log
          cargo check --locked --all-targets 2>&1 | tee target/removal-policy-verification/check.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/removal-policy-verification/clippy.log
          cargo fmt --all --check 2>&1 | tee target/removal-policy-verification/fmt.log
          git diff --check

      - name: Publish only verified source directly to main
        run: |
          set -euo pipefail
          git diff --binary > target/removal-policy-verification/reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/evaluator.rs src/heredoc.rs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'feat(core): protect interpreter removals with complete source ownership (#461)' -m 'Resolve trusted Python, Node and Ruby file removals and recursive directory operations. Preserve full quote-concatenated source arguments, here-string receiver languages, parsed import bindings, bounded timeout retries, independent rule grants, and all original failing assertions. Three real-entry-point regressions failed before repair; focused extraction and classifier tests, hook/CLI suites, full library, all-target check, Clippy and formatting passed before publication.'
          git rev-parse HEAD > target/removal-policy-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              cargo test --locked --lib -- --test-threads=1
              cargo test --locked --test credential_file_transfer_e2e
              cargo test --locked --test credential_file_embedded_e2e
              cargo test --locked --test repro_442_source_modules_are_declared
              cargo test --locked --test repro_459_argv_split_spawns
              cargo check --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              cargo fmt --all --check
              git diff --check
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/removal-policy-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main advanced; retaining the verified repair without a force push'
          exit 1

      - name: Retain exact source and diagnostics
        if: always()
        run: |
          mkdir -p target/removal-policy-verification
          git diff --binary > target/removal-policy-verification/unpublished.patch
          git show --stat --oneline HEAD > target/removal-policy-verification/head.txt
          tar -czf target/removal-policy-verification/repaired-source.tar.gz \
            src/evaluator.rs src/heredoc.rs \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/transfers.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: removal-policy-verification-${{ github.sha }}
          path: target/removal-policy-verification/
          if-no-files-found: error
