name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-policy-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Activate the repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/multi-rule-verification
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Stage the reviewed multi-rule repair
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/multi-rule.patch" <<'PATCH'
