name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-removal-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source and activate the pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p target/removal-policy-verification
          git rev-parse HEAD > target/removal-policy-verification/base-revision.txt
          git show 4f7b6eb09eb0ce60a78a0901740a9027d2ad2610:.github/workflows/credential-policy-verification.yml > target/removal-policy-verification/read-only-workflow.yml
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retrieve the exact reviewed patch and stage integration controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'User-Agent: OpenAI File Downloader, XaiImageApiFetch/1.0' \
            "repos/$GITHUB_REPOSITORY/git/blobs/dc00d56d99db23e0a9c62565913843823bf4fed5" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/protected-removals.patch"
          test "$(git hash-object "$RUNNER_TEMP/protected-removals.patch")" = dc00d56d99db23e0a9c62565913843823bf4fed5
          git apply --check "$RUNNER_TEMP/protected-removals.patch"
          git apply --include=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/protected-removals.patch"

      - name: Reproduce all three language-specific failures before repair
        run: |
          set -euo pipefail
          for language in python node ruby; do
            name="${language}_protected_removals_reach_hook_cli_and_stdin"
            set +e
            cargo test --locked --test credential_file_transfer_e2e "$name" -- --exact \
              2>&1 | tee "target/removal-policy-verification/baseline-$language.log"
            result=${PIPESTATUS[0]}
            set -e
            test "$result" -eq 101
            grep -F "test $name ... FAILED" "target/removal-policy-verification/baseline-$language.log"
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "target/removal-policy-verification/baseline-$language.log"
          done

      - name: Apply and format the reviewed implementation
        run: |
          set -euo pipefail
          git apply --check --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/protected-removals.patch"
          git apply --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/protected-removals.patch"
          rustfmt --edition 2024 --config skip_children=true \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/transfers.rs \
            tests/credential_file_transfer_e2e.rs
          git diff --check
          git diff --stat
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/transfers.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done

      - name: Credential classifiers and real entry points
        run: |
          set -euo pipefail
          cargo test --locked --lib credential_files \
            2>&1 | tee target/removal-policy-verification/credential-files.log
          cargo test --locked --test credential_file_transfer_e2e -- --list \
            2>&1 | tee target/removal-policy-verification/discovered-transfers.log
          for name in python_protected_removals_reach_hook_cli_and_stdin node_protected_removals_reach_hook_cli_and_stdin ruby_protected_removals_reach_hook_cli_and_stdin protected_removal_rule_grants_do_not_hide_other_targets; do
            grep -Fx "$name: test" target/removal-policy-verification/discovered-transfers.log
          done
          cargo test --locked --test credential_file_transfer_e2e \
            2>&1 | tee target/removal-policy-verification/transfer-e2e.log
          cargo test --locked --test credential_file_embedded_e2e \
            2>&1 | tee target/removal-policy-verification/embedded-e2e.log

      - name: Complete library and quality gates
        run: |
          set -euo pipefail
          cargo test --locked --lib -- --test-threads=1 \
            2>&1 | tee target/removal-policy-verification/full-lib.log
          cargo test --locked --test repro_442_source_modules_are_declared \
            2>&1 | tee target/removal-policy-verification/source-modules.log
          cargo check --locked --all-targets 2>&1 | tee target/removal-policy-verification/check.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/removal-policy-verification/clippy.log
          cargo fmt --all --check 2>&1 | tee target/removal-policy-verification/fmt.log
          git diff --check
          if command -v ubs >/dev/null 2>&1; then
            ubs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs \
              2>&1 | tee target/removal-policy-verification/ubs.log
          else
            echo 'UBS is not installed on this hosted runner; no UBS pass claimed.' > target/removal-policy-verification/ubs.log
          fi

      - name: Publish only verified source directly to main
        run: |
          set -euo pipefail
          git diff --binary > target/removal-policy-verification/reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'feat(core): protect credential removals through trusted interpreter APIs (#461)' -m 'Resolve Python os.remove/unlink, Path.unlink and shutil.rmtree; Node unlink/rm callback, sync and promise APIs; and every Ruby File.delete/unlink operand. Preserve composed-path provenance, effective recursion options, ordinary-file controls and independent rule grants. Three real-entry-point regressions failed before repair; classifier, hook/CLI, complete library, all-target check, Clippy and formatting passed before publication.'
          git rev-parse HEAD > target/removal-policy-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              cargo test --locked --lib credential_files
              cargo test --locked --test credential_file_transfer_e2e
              cargo test --locked --test credential_file_embedded_e2e
              cargo test --locked --lib -- --test-threads=1
              cargo test --locked --test repro_442_source_modules_are_declared
              cargo check --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              cargo fmt --all --check
              git diff --check
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/removal-policy-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main advanced; retaining the verified repair without a force push'
          exit 1

      - name: Retain exact source and diagnostics
        if: always()
        run: |
          mkdir -p target/removal-policy-verification
          git diff --binary > target/removal-policy-verification/unpublished.patch
          git show --stat --oneline HEAD > target/removal-policy-verification/head.txt
          tar -czf target/removal-policy-verification/repaired-source.tar.gz \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/transfers.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: removal-policy-verification-${{ github.sha }}
          path: target/removal-policy-verification/
          if-no-files-found: error
