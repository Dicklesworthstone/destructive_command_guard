          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/ast_matcher.rs|src/evaluator.rs|src/packs/core/credential_files.rs|src/packs/core/credential_files/embedded.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ast_matcher.rs src/evaluator.rs src/packs/core/credential_files.rs src/packs/core/credential_files/embedded.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'fix(core): retain independent protected-write findings through allowlists (#461)' -m 'Preserve both effects of a rename, all command-level rule families, and every established extraction-fallback finding. The new cross-rule end-to-end control failed before repair; focused regressions, full library tests, check, Clippy, and formatting passed before publication.'
          git push origin HEAD:main
          git rev-parse HEAD | tee target/multi-rule-verification/published-revision.txt

      - name: Retain exact diagnostics and source
        if: always()
        shell: bash
        run: |
          mkdir -p target/multi-rule-verification
          git diff --binary > target/multi-rule-verification/unpublished.patch
          git show --stat --oneline HEAD > target/multi-rule-verification/head.txt
          tar -czf target/multi-rule-verification/repaired-source.tar.gz src/ast_matcher.rs src/evaluator.rs src/packs/core/credential_files.rs src/packs/core/credential_files/embedded.rs tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-rule-verification-${{ github.sha }}
          path: target/multi-rule-verification/
          if-no-files-found: error
