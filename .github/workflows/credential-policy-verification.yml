name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-path-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record inputs and activate the pinned Rust toolchain
        run: |
          set -euo pipefail
          mkdir -p target/composed-path-verification
          git rev-parse HEAD > target/composed-path-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retrieve the reviewed source and actual failing controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 35672949078 --repo "$GITHUB_REPOSITORY" \
            --name composed-path-verification-2b42ba5b87d1d1bf559ecd115f62a21efb126553 \
            --dir "$RUNNER_TEMP/reviewed-paths"
          test "$(git hash-object "$RUNNER_TEMP/reviewed-paths/unpublished.patch")" = 76d56dc28ba4d00cf670e40dd6895134452a7e4d
          cp "$RUNNER_TEMP/reviewed-paths/baseline.log" target/composed-path-verification/baseline.log
          cp "$RUNNER_TEMP/reviewed-paths/initial-credential-files.log" target/composed-path-verification/normalization-before.log
          grep -F 'test node_and_ruby_composed_paths_reach_hook_cli_and_stdin ... FAILED' target/composed-path-verification/baseline.log
          grep -F 'test result: FAILED. 84 passed; 1 failed;' target/composed-path-verification/normalization-before.log
          git apply --check "$RUNNER_TEMP/reviewed-paths/unpublished.patch"
          git apply "$RUNNER_TEMP/reviewed-paths/unpublished.patch"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/a187aa54edfca13e6d4d930f3099d74d1b43647a" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/node-normalization.patch"
          test "$(git hash-object "$RUNNER_TEMP/node-normalization.patch")" = a187aa54edfca13e6d4d930f3099d74d1b43647a
          git apply --check "$RUNNER_TEMP/node-normalization.patch"
          git apply "$RUNNER_TEMP/node-normalization.patch"

      - name: Format only the reviewed implementation and regressions
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs
          git diff --check
          git diff --stat

      - name: Verify and commit the complete repair directly to main
        run: |
          set -euo pipefail
          verify() {
            local label="$1"
            cargo test --locked --lib credential_files 2>&1 | tee "target/composed-path-verification/$label-credential-files.log"
            cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee "target/composed-path-verification/$label-transfer-e2e.log"
            cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee "target/composed-path-verification/$label-embedded-e2e.log"
            cargo test --locked --lib 2>&1 | tee "target/composed-path-verification/$label-full-lib.log"
            cargo check --locked --all-targets 2>&1 | tee "target/composed-path-verification/$label-check.log"
            cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "target/composed-path-verification/$label-clippy.log"
            cargo fmt --all --check
            git diff --check
          }
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/tests.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          verify initial
          git diff --binary > target/composed-path-verification/reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'feat(core): protect composed Node and Ruby credential paths (#461)' -m 'Track builtin os/path/process modules through require, ESM imports, destructuring and static bracket access. Resolve homedir, HOME, join and resolve, including lexical dot normalization and opaque symbolic home boundaries. Recognize Ruby Dir.home and File.join. Preserve independent rename findings, reads, known_hosts appends and literal tilde controls. Original failing assertions retained; focused and complete library tests, real-entry-point regressions, all-target check, Clippy and formatting passed before publication.'
          git rev-parse HEAD > target/composed-path-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              verify "merged-$attempt"
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/composed-path-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main advanced; retaining the repair without a force push'
          exit 1

      - name: Retain exact source and all diagnostics
        if: always()
        run: |
          mkdir -p target/composed-path-verification
          git diff --binary > target/composed-path-verification/unpublished.patch
          git show --stat --oneline HEAD > target/composed-path-verification/head.txt
          tar -czf target/composed-path-verification/repaired-source.tar.gz \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composed-path-verification-${{ github.sha }}
          path: target/composed-path-verification/
          if-no-files-found: error
