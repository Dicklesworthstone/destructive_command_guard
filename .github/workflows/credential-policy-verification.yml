name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-policy-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate the repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/multi-rule-verification
          git rev-parse HEAD > target/multi-rule-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Apply the exact reconciled and formatted source repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 35648126808 --repo "$GITHUB_REPOSITORY" \
            --name multi-rule-verification-6d02479da7db457f67c4b2c3eda24102d537571f \
            --dir "$RUNNER_TEMP/reviewed-multi-rule"
          echo "1a4f5ed17bc9c55b07ad79f23638d121bf4de5d0f458e8dfadf44cfa4dcc368f  $RUNNER_TEMP/reviewed-multi-rule/unpublished.patch" | sha256sum --check
          cp "$RUNNER_TEMP/reviewed-multi-rule/baseline.log" target/multi-rule-verification/baseline.log
          grep -F 'test result: FAILED' target/multi-rule-verification/baseline.log
          grep -F 'cross_rule_grants_survive_every_delivery_and_extraction_mode ... FAILED' target/multi-rule-verification/baseline.log
          git apply --check "$RUNNER_TEMP/reviewed-multi-rule/unpublished.patch"
          git apply "$RUNNER_TEMP/reviewed-multi-rule/unpublished.patch"
          # The only ast_pattern_engine.rs change wraps one test call. It is
          # included in the reviewed patch rather than silently formatting main.
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/ast_matcher.rs|src/ast_pattern_engine.rs|src/evaluator.rs|src/packs/core/credential_files.rs|src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/tests.rs|src/packs/core/credential_files/embedded/transfers.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          git diff --check
          git diff --stat
          cargo fmt --all --check

      - name: Verify and publish only passing source directly to main
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local label="$1"
            cargo test --locked --lib credential_files 2>&1 | tee "target/multi-rule-verification/$label-credential-files.log"
            cargo test --locked --lib ast_matcher::tests 2>&1 | tee "target/multi-rule-verification/$label-ast-policy.log"
            cargo test --locked --lib extraction_backstop_applies_each_rule_grant_independently_461 2>&1 | tee "target/multi-rule-verification/$label-fallback.log"
            cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee "target/multi-rule-verification/$label-transfer-e2e.log"
            cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee "target/multi-rule-verification/$label-embedded-e2e.log"
            cargo test --locked --test repro_459_argv_split_spawns 2>&1 | tee "target/multi-rule-verification/$label-argv-spawns.log"
            cargo test --locked --test repro_442_source_modules_are_declared 2>&1 | tee "target/multi-rule-verification/$label-source-modules.log"
            cargo test --locked --lib 2>&1 | tee "target/multi-rule-verification/$label-full-lib.log"
            cargo check --locked --all-targets 2>&1 | tee "target/multi-rule-verification/$label-check.log"
            cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "target/multi-rule-verification/$label-clippy.log"
            cargo fmt --all --check
            git diff --check
          }
          verify initial
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ast_matcher.rs src/ast_pattern_engine.rs src/evaluator.rs src/packs/core/credential_files.rs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'fix(core): retain independent protected-write findings through allowlists (#461)' -m 'Preserve both effects of a rename and all command-level and early-source rule families. Keep the concurrently improved extraction fallback and verify it directly. The new end-to-end control failed before repair; focused regressions, complete library tests, all-target check, Clippy, and formatting passed before publication.'
          git rev-parse HEAD > target/multi-rule-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              verify "merged-$attempt"
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/multi-rule-verification/published-revision.txt
              exit 0
            fi
          done
          echo '::error::main kept advancing; the verified patch is retained without any force-push'
          exit 1

      - name: Retain exact diagnostics and source
        if: always()
        shell: bash
        run: |
          mkdir -p target/multi-rule-verification
          base=$(cat target/multi-rule-verification/base-revision.txt)
          git diff --binary > target/multi-rule-verification/unpublished.patch
          git diff --binary "$base" -- src/ast_matcher.rs src/ast_pattern_engine.rs src/evaluator.rs src/packs/core/credential_files.rs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs > target/multi-rule-verification/reviewed.patch
          git show --stat --oneline HEAD > target/multi-rule-verification/head.txt
          tar -czf target/multi-rule-verification/repaired-source.tar.gz src/ast_matcher.rs src/ast_pattern_engine.rs src/evaluator.rs src/packs/core/credential_files.rs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-rule-verification-${{ github.sha }}
          path: target/multi-rule-verification/
          if-no-files-found: error
