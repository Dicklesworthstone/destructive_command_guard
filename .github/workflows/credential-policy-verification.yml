name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-path-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record inputs and activate the pinned Rust toolchain
        run: |
          set -euo pipefail
          mkdir -p target/composed-path-verification
          git rev-parse HEAD > target/composed-path-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retrieve the reviewed Node and Ruby source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/a0a09f129888f2de9a4bbd23a99a5197b1b877fd" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/composed-paths.patch"
          test "$(git hash-object "$RUNNER_TEMP/composed-paths.patch")" = a0a09f129888f2de9a4bbd23a99a5197b1b877fd
          git apply --check --recount "$RUNNER_TEMP/composed-paths.patch"

      - name: Demonstrate the regression on unchanged production code
        run: |
          set -euo pipefail
          git apply --recount --include=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/composed-paths.patch"
          set +e
          cargo test --locked --test credential_file_transfer_e2e node_and_ruby_composed_paths_reach_hook_cli_and_stdin -- --exact \
            2>&1 | tee target/composed-path-verification/baseline.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 101
          grep -F 'test node_and_ruby_composed_paths_reach_hook_cli_and_stdin ... FAILED' target/composed-path-verification/baseline.log
          grep -F 'test result: FAILED. 0 passed; 1 failed;' target/composed-path-verification/baseline.log

      - name: Apply and format the reviewed implementation
        run: |
          set -euo pipefail
          git apply --check --recount --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/composed-paths.patch"
          git apply --recount --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/composed-paths.patch"
          rustfmt --edition 2024 --config skip_children=true \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs
          git diff --check
          git diff --stat

      - name: Verify and commit the complete repair directly to main
        run: |
          set -euo pipefail
          verify() {
            local label="$1"
            cargo test --locked --lib credential_files 2>&1 | tee "target/composed-path-verification/$label-credential-files.log"
            cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee "target/composed-path-verification/$label-transfer-e2e.log"
            cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee "target/composed-path-verification/$label-embedded-e2e.log"
            cargo test --locked --lib 2>&1 | tee "target/composed-path-verification/$label-full-lib.log"
            cargo check --locked --all-targets 2>&1 | tee "target/composed-path-verification/$label-check.log"
            cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "target/composed-path-verification/$label-clippy.log"
            cargo fmt --all --check
            git diff --check
          }
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/tests.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          verify initial
          git diff --binary > target/composed-path-verification/reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'feat(core): protect composed Node and Ruby credential paths (#461)' -m 'Track builtin Node os/path/process modules through require, ESM imports, destructuring and static bracket access. Resolve homedir, HOME, join and resolve with their distinct semantics. Recognize Ruby Dir.home, File.join and home concatenation. Preserve independent rename findings, reads, known_hosts appends and literal tilde controls. The new real hook/CLI control failed before repair; credential and full-library tests, end-to-end checks, all-target check, Clippy and formatting passed before publication.'
          git rev-parse HEAD > target/composed-path-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              verify "merged-$attempt"
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/composed-path-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main advanced; retaining the repair without a force push'
          exit 1

      - name: Retain exact source and all diagnostics
        if: always()
        run: |
          mkdir -p target/composed-path-verification
          git diff --binary > target/composed-path-verification/unpublished.patch
          git show --stat --oneline HEAD > target/composed-path-verification/head.txt
          tar -czf target/composed-path-verification/repaired-source.tar.gz \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composed-path-verification-${{ github.sha }}
          path: target/composed-path-verification/
          if-no-files-found: error
