name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - tests/credential_file_*.rs
      - tests/repro_442_*.rs
      - tests/repro_459_argv_split_spawns.rs
      - scripts/*scanner*
      - vendor/tree-sitter-bash/**
  pull_request:
    paths:
      - .github/workflows/credential-policy-verification.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - tests/credential_file_*.rs
      - tests/repro_442_*.rs
      - tests/repro_459_argv_split_spawns.rs
      - scripts/*scanner*
      - vendor/tree-sitter-bash/**
  workflow_dispatch:

concurrency:
  group: credential-policy-verification-${{ github.ref }}
  cancel-in-progress: true

# Verify submitted source, without patching or publishing it.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record the submitted revision
        run: |
          set -euo pipefail
          mkdir -p target/credential-policy-verification
          git rev-parse HEAD | tee target/credential-policy-verification/revision.txt

      - name: Activate the pinned Rust toolchain
        id: toolchain
        run: |
          set -euo pipefail
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Verify generated parser consistency
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --user-agent 'OpenAI File Downloader, XaiImageApiFetch/1.0' \
            https://github.com/tree-sitter/tree-sitter/releases/download/v0.25.10/tree-sitter-linux-x64.gz \
            --output "$RUNNER_TEMP/tree-sitter.gz"
          echo "8283ddba69253c698f6e987ba0e2f9285e079c8db4d36ebe1394b5bb3a0ebdfd  $RUNNER_TEMP/tree-sitter.gz" | sha256sum --check
          gzip --decompress --stdout "$RUNNER_TEMP/tree-sitter.gz" > "$RUNNER_TEMP/tree-sitter"
          chmod +x "$RUNNER_TEMP/tree-sitter"
          (cd vendor/tree-sitter-bash && "$RUNNER_TEMP/tree-sitter" generate)
          git diff --exit-code -- vendor/tree-sitter-bash \
            | tee target/credential-policy-verification/parser-generation.log

      - name: Here-string and credential classifier regressions
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked --lib credential_files::embedded::here_string_tests -- --list \
            2>&1 | tee target/credential-policy-verification/discovered-here-strings.log
          count=$(sed -nE 's/^([0-9]+) tests?,.*/\1/p' target/credential-policy-verification/discovered-here-strings.log)
          test "${count:-0}" -ge 10
          cargo test --locked --lib credential_files::embedded::here_string_tests \
            2>&1 | tee target/credential-policy-verification/here-strings.log
          cargo test --locked --lib credential_files \
            2>&1 | tee target/credential-policy-verification/credential-files.log

      - name: Transfer, link and opaque-option hook and CLI coverage
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked --test credential_file_transfer_e2e -- --list \
            2>&1 | tee target/credential-policy-verification/discovered-transfers.log
          for name in python_link_creation_reaches_hook_cli_and_stdin node_link_creation_reaches_hook_cli_and_stdin ruby_link_creation_reaches_hook_cli_and_stdin link_rule_grants_apply_to_the_new_name_only opaque_ruby_options_cannot_suppress_hook_or_cli_writes cross_rule_grants_survive_every_delivery_and_extraction_mode; do
            grep -Fx "$name: test" target/credential-policy-verification/discovered-transfers.log
          done
          cargo test --locked --test credential_file_transfer_e2e \
            2>&1 | tee target/credential-policy-verification/transfer-e2e.log
          cargo test --locked --test credential_file_embedded_e2e \
            2>&1 | tee target/credential-policy-verification/embedded-e2e.log

      - name: Early source, extraction fallback and argv-spawn coverage
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked --lib ast_matcher::tests \
            2>&1 | tee target/credential-policy-verification/ast-policy.log
          for name in extraction_backstop_applies_each_rule_grant_independently_461 timeout_backstop_skips_the_bodies_the_primary_path_skips_461; do
            cargo test --locked --lib "$name" -- --list \
              2>&1 | tee "target/credential-policy-verification/discovered-$name.log"
            grep -F "::$name: test" "target/credential-policy-verification/discovered-$name.log"
            cargo test --locked --lib "$name" \
              2>&1 | tee "target/credential-policy-verification/$name.log"
          done
          cargo test --locked --test repro_459_argv_split_spawns \
            2>&1 | tee target/credential-policy-verification/argv-spawns.log

      - name: Complete library suite
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked --lib -- --test-threads=1 \
            2>&1 | tee target/credential-policy-verification/full-lib.log

      - name: Scanner safety and vendored linkage
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo test --locked --lib scanner_regression_tests \
            2>&1 | tee target/credential-policy-verification/scanner-regressions.log
          cargo test --locked --test repro_442_source_modules_are_declared \
            2>&1 | tee target/credential-policy-verification/source-modules.log
          cargo test --locked --test repro_442_vendored_scanner_is_linked \
            2>&1 | tee target/credential-policy-verification/vendor-linkage.log
          python3 -m unittest discover -s scripts -p test_check_scanner_safety.py -v \
            2>&1 | tee target/credential-policy-verification/scanner-gate.log
          python3 scripts/check_scanner_safety.py prepare \
            2>&1 | tee target/credential-policy-verification/scanner-unicode.log

      - name: All-target compilation
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo check --locked --all-targets 2>&1 | tee target/credential-policy-verification/check.log

      - name: All-target Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/credential-policy-verification/clippy.log

      - name: Formatting and source integrity
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo fmt --all --check 2>&1 | tee target/credential-policy-verification/fmt.log
          git diff --check
          git diff --exit-code

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-policy-verification-${{ github.sha }}
          path: |
            target/credential-policy-verification/
            target/scanner-safety/*.log
          if-no-files-found: error
