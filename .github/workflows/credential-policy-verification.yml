name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Apply reviewed source-boundary repair
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/credential-source.patch" <<'PATCH'
          diff --git a/src/packs/core/credential_files.rs b/src/packs/core/credential_files.rs
          --- a/src/packs/core/credential_files.rs
          +++ b/src/packs/core/credential_files.rs
          @@ -29,5 +29,16 @@ pub(crate) fn classify_credential_file_write(
           ) -> Option<CredentialFileWrite> {
               shell::classify_credential_file_write(segment, dialect)
                   .or_else(|| embedded::classify(segment, dialect))
           }
          +
          +/// Inspect executable scripts before the evaluator masks or segments their
          +/// source. The embedded classifier proves the interpreter receiver itself;
          +/// the shell classifier must continue to use its separate, sanitized view.
          +/// Spans returned here are relative to the original, complete command.
          +pub(crate) fn classify_embedded_credential_file_write(
          +    command: &str,
          +    dialect: ShellDialect,
          +) -> Option<CredentialFileWrite> {
          +    embedded::classify(command, dialect)
          +}
          diff --git a/src/evaluator.rs b/src/evaluator.rs
          --- a/src/evaluator.rs
          +++ b/src/evaluator.rs
          @@ -23428,6 +23428,15 @@ fn evaluate_core_filesystem_pack(
               }
           }
           
          +    // Script literals and heredoc bodies are semantic input, not shell
          +    // regex input. Scan the complete original source once, before using
          +    // the sanitized per-segment view. In particular, an unknown shell
          +    // dialect must not silently discard the embedded write destination.
          +    let mut embedded_write =
          +        crate::packs::core::credential_files::classify_embedded_credential_file_write(
          +            original_command,
          +            shell_dialect,
          +        );
          +
               for &(segment_start, segment_end) in segment_ranges {
                   if deadline_exceeded(deadline) || remaining_below(deadline, &crate::perf::PATTERN_MATCH) {
                       return Some(EvaluationResult::indeterminate_due_to_budget());
          @@ -23474,11 +23483,22 @@ fn evaluate_core_filesystem_pack(
                   // outranks `redirect-truncate-root-home` and the #390 absent-file
                   // carve-out (which only stands that one rule down). Nested
                   // substitution ranges are evaluated as their own segments.
          -        if let Some(hit) = crate::packs::core::credential_files::classify_credential_file_write(
          +        let segment_write = crate::packs::core::credential_files::classify_credential_file_write(
                       mask_nested_segment_ranges(dialect_segment, segment_start, &nested_segment_ranges)
                           .as_ref(),
                       shell_dialect,
          -        ) {
          +        );
          +        // Keep both hits: allowing an embedded credential write must not
          +        // suppress a shell write governed by the distinct Git rule.
          +        for (hit, hit_start, hit_offset) in embedded_write
          +            .take()
          +            .map(|hit| (hit, 0, Some(0)))
          +            .into_iter()
          +            .chain(segment_write.map(|hit| (hit, segment_start, normalized_offset)))
          +        {
                       // The hit names its own rule: `.git/` writes deny under
                       // `git-internals-write` so allowing one does not also allow a
                       // write to `~/.ssh/authorized_keys` (#457).
          @@ -23487,10 +23507,10 @@ fn evaluate_core_filesystem_pack(
                       let severity = crate::packs::Severity::Critical;
                       let (explanation, suggestions) = pack.rule_guidance(rule);
                       let span = MatchSpan {
          -                start: hit.span.start + segment_start,
          -                end: hit.span.end + segment_start,
          +                start: hit.span.start + hit_start,
          +                end: hit.span.end + hit_start,
                       };
          -            let mapped_span = map_span_with_offset(span, normalized_offset, original_len);
          +            let mapped_span = map_span_with_offset(span, hit_offset, original_len);
                       let preview = mapped_span
                           .as_ref()
                           .map(|span| extract_match_preview(original_command, span));
          PATCH
          if git apply --reverse --check --recount "$RUNNER_TEMP/credential-source.patch"; then
            echo 'Reviewed repair is already present.'
          else
            git apply --check --recount "$RUNNER_TEMP/credential-source.patch"
            git apply --recount "$RUNNER_TEMP/credential-source.patch"
          fi
          git diff --check
          git diff --stat

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Format changed Rust files
        run: cargo fmt --all

      - name: Focused library and real-entry-point regressions
        id: focused
        run: |
          cargo test --locked --lib credential_files
          cargo test --locked --test credential_file_embedded_e2e

      - name: Publish verified source repair directly to main
        if: steps.focused.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to publish.'
            exit 0
          fi
          # Never include unrelated formatting changes or overwrite concurrent work.
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/evaluator.rs|src/packs/core/credential_files.rs|src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/tests.rs|tests/credential_file_embedded_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/evaluator.rs src/packs/core/credential_files.rs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs tests/credential_file_embedded_e2e.rs
          git commit -m 'fix(core): enforce embedded protected-write policy on original executable source (#461)'
          git push origin HEAD:main
          git rev-parse HEAD

      - name: Check all targets
        if: always() && steps.focused.outcome == 'success'
        run: cargo check --locked --all-targets

      - name: Full test suite
        if: always() && steps.focused.outcome == 'success'
        run: cargo test --locked --no-fail-fast

      - name: Clippy all targets
        if: always() && steps.focused.outcome == 'success'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Formatting check
        if: always() && steps.focused.outcome == 'success'
        run: cargo fmt --all --check
