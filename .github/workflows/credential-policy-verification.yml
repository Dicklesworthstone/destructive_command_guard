name: Credential policy verification

on:
  push:
    branches: [main]
    paths: [.github/workflows/credential-policy-verification.yml]
  workflow_dispatch:

concurrency:
  group: credential-php-perl-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
      REGRESSION_PATCH: 6dd697f751e6e6fdd7453a6f8b4e4fce95374ad9
      IMPLEMENTATION_PATCHES: fe77a3e58058025bff2269fd7343672dec86cd97 19bb8e52cffd55d6ba0e0b56b961840b022512b7
      PHP_SOURCE: ce5918727f5326f3e0e3f2842b84d0ee7a1274be
      PERL_SOURCE: 64124368522f6842b75c9b9a04067c1526851f50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate the repository toolchain
        run: |
          set -euo pipefail
          mkdir -p target/php-perl-verification
          git rev-parse HEAD > target/php-perl-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: credential-php-perl-verification
          cache-on-failure: true
      - name: Apply exact reviewed implementation and regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee target/php-perl-verification/patch-application.log) 2>&1
          # The unchanged implementation's failing regression and passing benign
          # controls are recorded by run 35686775794; avoid rebuilding it here.
          test "$(git rev-parse HEAD:src/packs/core/credential_files/embedded.rs)" = 6a183983349021742f46f70d4d3e8bbf86df64ca
          for language in php perl; do
            variable="${language^^}_SOURCE"
            sha="${!variable}"
            path="src/packs/core/credential_files/embedded/$language.rs"
            test ! -e "$path"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode > "$path"
            test "$(git hash-object "$path")" = "$sha"
          done
          for sha in $REGRESSION_PATCH $IMPLEMENTATION_PATCHES; do
            patch="target/php-perl-verification/$sha.patch"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode > "$patch"
            test "$(git hash-object "$patch")" = "$sha"
            git apply --recount --check "$patch"
            git apply --recount "$patch"
          done
          rustfmt --edition 2024 --config skip_children=true src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/php.rs src/packs/core/credential_files/embedded/perl.rs tests/credential_file_embedded_e2e.rs
          git diff --check
      - name: Verify complete implementation before publication
        run: |
          set -euo pipefail
          status=0
          check() {
            local name="$1"
            shift
            if ! "$@" 2>&1 | tee "target/php-perl-verification/$name.log"; then
              status=1
            fi
          }
          check classifiers cargo test --locked --lib credential_files
          check embedded-e2e cargo test --locked --test credential_file_embedded_e2e
          check transfer-e2e cargo test --locked --test credential_file_transfer_e2e
          check full-lib cargo test --locked --lib -- --test-threads=1
          check check cargo check --locked --all-targets
          check clippy cargo clippy --locked --all-targets -- -D warnings
          check fmt cargo fmt --all --check
          git diff --check
          exit "$status"
      - name: Publish verified source directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/php.rs src/packs/core/credential_files/embedded/perl.rs tests/credential_file_embedded_e2e.rs
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/php.rs|src/packs/core/credential_files/embedded/perl.rs|tests/credential_file_embedded_e2e.rs) ;;
              *) echo "Unexpected source path: $path"; exit 1 ;;
            esac
          done
          git commit -m 'feat(core): guard PHP and bounded Perl protected-file writes (#466)'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              cargo test --locked --lib credential_files
              cargo test --locked --test credential_file_embedded_e2e
              cargo test --locked --test credential_file_transfer_e2e
              cargo test --locked --lib -- --test-threads=1
              cargo check --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              cargo fmt --all --check
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD > target/php-perl-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main kept advancing; reviewed source retained without force push'
          exit 1
      - name: Retain source and diagnostics
        if: always()
        run: |
          mkdir -p target/php-perl-verification
          git diff --binary > target/php-perl-verification/unpublished.patch
          tar -czf target/php-perl-verification/source.tar.gz src/packs/core/credential_files tests/credential_file_embedded_e2e.rs Cargo.toml rust-toolchain.toml
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-perl-verification-${{ github.sha }}
          path: target/php-perl-verification/
          if-no-files-found: error
