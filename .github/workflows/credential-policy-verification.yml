name: Credential policy verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-policy-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-link-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source and activate the pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p target/link-policy-verification
          git rev-parse HEAD > target/link-policy-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retrieve exact reviewed patches and stage only integration controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for sha in 8737d3ca253b83d854af5619a16f401b98742702 61974736b4f61aec4589d04a384db588cf4183fe; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content \
              | base64 --decode > "$RUNNER_TEMP/$sha.patch"
            test "$(git hash-object "$RUNNER_TEMP/$sha.patch")" = "$sha"
            git apply --check --recount --include=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/$sha.patch"
            git apply --recount --include=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/$sha.patch"
          done
          # The baseline must retain unchanged production and unit-test source.
          git diff --exit-code -- src

      - name: Reproduce four independent hook and CLI failures
        run: |
          set -euo pipefail
          for name in opaque_ruby_options_cannot_suppress_hook_or_cli_writes python_link_creation_reaches_hook_cli_and_stdin node_link_creation_reaches_hook_cli_and_stdin ruby_link_creation_reaches_hook_cli_and_stdin; do
            set +e
            cargo test --locked --test credential_file_transfer_e2e "$name" -- --exact \
              2>&1 | tee "target/link-policy-verification/baseline-$name.log"
            result=${PIPESTATUS[0]}
            set -e
            test "$result" -eq 101
            grep -F "test $name ... FAILED" "target/link-policy-verification/baseline-$name.log"
            grep -F 'test result: FAILED. 0 passed; 1 failed;' "target/link-policy-verification/baseline-$name.log"
          done

      - name: Apply and format the reviewed implementation
        run: |
          set -euo pipefail
          for sha in 8737d3ca253b83d854af5619a16f401b98742702 61974736b4f61aec4589d04a384db588cf4183fe; do
            git apply --check --recount --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/$sha.patch"
            git apply --recount --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/$sha.patch"
          done
          rustfmt --edition 2024 --config skip_children=true \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            src/packs/core/credential_files/embedded/transfers.rs \
            tests/credential_file_transfer_e2e.rs
          git diff --check
          git diff --name-only | while IFS= read -r path; do
            case "$path" in
              src/packs/core/credential_files/embedded.rs|src/packs/core/credential_files/embedded/tests.rs|src/packs/core/credential_files/embedded/transfers.rs|tests/credential_file_transfer_e2e.rs) ;;
              *) echo "Unexpected changed path: $path"; exit 1 ;;
            esac
          done
          git diff --binary > target/link-policy-verification/reviewed.patch
          git diff --stat

      - name: Credential classifiers and real hook and CLI regressions
        run: |
          set -euo pipefail
          cargo test --locked --lib credential_files 2>&1 | tee target/link-policy-verification/credential-files.log
          cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee target/link-policy-verification/transfer-e2e.log
          cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee target/link-policy-verification/embedded-e2e.log

      - name: Complete library and quality gates
        run: |
          set -euo pipefail
          cargo test --locked --lib -- --test-threads=1 2>&1 | tee target/link-policy-verification/full-lib.log
          cargo check --locked --all-targets 2>&1 | tee target/link-policy-verification/check.log
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/link-policy-verification/clippy.log
          cargo fmt --all --check 2>&1 | tee target/link-policy-verification/fmt.log
          git diff --check
          if command -v ubs >/dev/null 2>&1; then
            ubs src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs \
              2>&1 | tee target/link-policy-verification/ubs.log
          else
            echo 'UBS is not installed on the hosted runner; no UBS pass is claimed.' > target/link-policy-verification/ubs.log
          fi

      - name: Publish only verified source directly to main
        run: |
          set -euo pipefail
          verify_merged() {
            local label="$1"
            cargo test --locked --lib credential_files 2>&1 | tee "target/link-policy-verification/$label-credential-files.log"
            cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee "target/link-policy-verification/$label-transfer-e2e.log"
            cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee "target/link-policy-verification/$label-embedded-e2e.log"
            cargo test --locked --lib -- --test-threads=1 2>&1 | tee "target/link-policy-verification/$label-full-lib.log"
            cargo check --locked --all-targets 2>&1 | tee "target/link-policy-verification/$label-check.log"
            cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "target/link-policy-verification/$label-clippy.log"
            cargo fmt --all --check
            git diff --check
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs src/packs/core/credential_files/embedded/transfers.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'feat(core): protect credential link creation and preserve opaque write evidence (#461)' -m 'Recognize Python os and pathlib links, Node callback/sync/promise links, and Ruby File links through trusted bindings. Preserve pathlib receiver direction, symbolic directory targets, source non-mutation and independent destination-rule grants. Carry forward the pending Ruby-options correction without weakening its assertions. Four hook/CLI controls failed on unchanged production code; all credential, integration, full-library and quality gates passed before publication.'
          git rev-parse HEAD > target/link-policy-verification/source-commit.txt
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              verify_merged "merged-$attempt"
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD | tee target/link-policy-verification/published-revision.txt
              git push origin HEAD:master
              exit 0
            fi
          done
          echo '::error::main advanced; retaining verified source without a force push'
          exit 1

      - name: Retain exact source and diagnostics
        if: always()
        run: |
          mkdir -p target/link-policy-verification
          git diff --binary > target/link-policy-verification/unpublished.patch
          git show --stat --oneline HEAD > target/link-policy-verification/head.txt
          tar -czf target/link-policy-verification/repaired-source.tar.gz \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            src/packs/core/credential_files/embedded/transfers.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-policy-verification-${{ github.sha }}
          path: target/link-policy-verification/
          if-no-files-found: error
