name: Credential compound update verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/credential-compound-verification.yml
  workflow_dispatch:

concurrency:
  group: credential-compound-repair-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Dicklesworthstone/destructive_command_guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RCH_ENABLED: '0'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record inputs and activate the pinned Rust toolchain
        run: |
          set -euo pipefail
          mkdir -p target/compound-verification
          git rev-parse HEAD > target/compound-verification/base-revision.txt
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Retrieve the exact reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/5ea54d5e0f60fec6d59fb65049876598e1e4f2dd" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/compound.patch"
          test "$(git hash-object "$RUNNER_TEMP/compound.patch")" = 5ea54d5e0f60fec6d59fb65049876598e1e4f2dd
          cp "$RUNNER_TEMP/compound.patch" target/compound-verification/reviewed.patch
          git apply --check "$RUNNER_TEMP/compound.patch"

      - name: Demonstrate the real-entry-point failure on unchanged production
        run: |
          set -euo pipefail
          git apply --include=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/compound.patch"
          set +e
          cargo test --locked --test credential_file_transfer_e2e compound_open_flags_reach_hook_cli_and_stdin -- --exact \
            2>&1 | tee target/compound-verification/baseline.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 101
          grep -F 'test compound_open_flags_reach_hook_cli_and_stdin ... FAILED' target/compound-verification/baseline.log
          grep -F 'test result: FAILED. 0 passed; 1 failed;' target/compound-verification/baseline.log

      - name: Apply the reviewed implementation
        run: |
          set -euo pipefail
          git apply --check --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/compound.patch"
          git apply --exclude=tests/credential_file_transfer_e2e.rs "$RUNNER_TEMP/compound.patch"
          rustfmt --edition 2024 --config skip_children=true \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Verify and publish the complete source repair
        run: |
          set -euo pipefail
          verify() {
            local prefix="$1"
            cargo test --locked --lib credential_files 2>&1 | tee "target/compound-verification/$prefix-credential-files.log"
            cargo test --locked --test credential_file_transfer_e2e 2>&1 | tee "target/compound-verification/$prefix-transfer-e2e.log"
            cargo test --locked --test credential_file_embedded_e2e 2>&1 | tee "target/compound-verification/$prefix-embedded-e2e.log"
            cargo test --locked --test repro_459_argv_split_spawns 2>&1 | tee "target/compound-verification/$prefix-argv-spawns.log"
            cargo test --locked --lib -- --test-threads=1 2>&1 | tee "target/compound-verification/$prefix-full-lib.log"
            cargo check --locked --all-targets 2>&1 | tee "target/compound-verification/$prefix-check.log"
            cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "target/compound-verification/$prefix-clippy.log"
            cargo fmt --all --check 2>&1 | tee "target/compound-verification/$prefix-fmt.log"
            git diff --check
          }
          verify initial
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/packs/core/credential_files/embedded.rs src/packs/core/credential_files/embedded/tests.rs tests/credential_file_transfer_e2e.rs
          git commit -m 'fix(core): track compound updates to embedded write flags and paths (#461)' -m 'Track |= using existing symbolic flag effects, += using bounded text concatenation, and Python Path /= using the existing path resolver. Preserve RHS effects before invalidation and drop stale values after unsupported updates. Preserve reads, append-only known_hosts, inert source and independent rule grants. The new hook/CLI control failed before repair; credential, full-library and integration suites, all-target check, Clippy and formatting passed before publication.'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              verify "merged-$attempt"
            fi
            if git push origin HEAD:main; then
              git rev-parse HEAD > target/compound-verification/published-revision.txt
              exit 0
            fi
          done
          echo '::error::main kept advancing; source retained, never force-pushed'
          exit 1

      - name: Retain exact source and diagnostics
        if: always()
        run: |
          mkdir -p target/compound-verification
          git rev-parse HEAD > target/compound-verification/head.txt
          git diff --binary > target/compound-verification/unpublished.patch
          tar -czf target/compound-verification/repaired-source.tar.gz \
            src/packs/core/credential_files/embedded.rs \
            src/packs/core/credential_files/embedded/tests.rs \
            tests/credential_file_transfer_e2e.rs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compound-verification-${{ github.sha }}
          path: target/compound-verification/
          if-no-files-found: error
