# Bypass attempts: obfuscated destructive commands that MUST be blocked
#
# These are attempts to evade detection through various tricks.

[[case]]
description = "git reset with full path"
command = "/usr/bin/git reset --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "git with env prefix"
command = "env git reset --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "rm -rf with extra spaces"
command = "rm   -rf   /"
expected = "deny"

[[case]]
description = "rm with flags in different order"
command = "rm -f -r /"
expected = "deny"

[[case]]
description = "rm with combined flags different order"
command = "rm -fr /"
expected = "deny"

[[case]]
description = "git push force with equals"
command = "git push --force=true origin main"
expected = "deny"

[[case]]
description = "command with leading whitespace"
command = "  git reset --hard"
expected = "deny"

[[case]]
description = "command with trailing whitespace"
command = "git reset --hard  "
expected = "deny"

[[case]]
description = "sudo git reset"
command = "sudo git reset --hard"
expected = "deny"

[[case]]
description = "sudo rm -rf"
command = "sudo rm -rf /"
expected = "deny"

# NOTE: git clean -d -f (flags separated) is not currently detected.
# The pattern expects -fd or -df combined. This is a gap.
# Tracked in: tests/corpus/README.md (future enhancement)
# [[case]]
# description = "git clean variations"
# command = "git clean -d -f"
# expected = "deny"

[[case]]
description = "backslash escaped git"
command = "\\git reset --hard"
expected = "deny"

# Variable-rooted temp paths are fail-closed because the caller can point
# TMPDIR at `/`, `/etc`, or another persistent tree.
[[case]]
description = "rm -rf $TMPDIR is denied because the variable root is unknown"
command = "rm -rf $TMPDIR/build"
expected = "deny"

[[case]]
description = "rm -rf ${TMPDIR} is denied because the variable root is unknown"
command = "rm -rf ${TMPDIR}/build"
expected = "deny"

[[case]]
description = "quoted TMPDIR is still dynamic and denied"
command = "rm -rf \"$TMPDIR/build\""
expected = "deny"

[[case]]
description = "TMPDIR default expansion is denied because a nonempty unsafe value wins"
command = "rm -rf ${TMPDIR:-/tmp}/build"
expected = "deny"

[[case]]
description = "glob directory component with a literal git basename (#361)"
command = "/usr/*/git branch -D main"
expected = "deny"
rule_id = "core.git:branch-dynamic-token"

[[case]]
description = "glob root component with a literal git basename and dynamic branch (#361)"
command = "/*/bin/git branch $name"
expected = "deny"
rule_id = "core.git:branch-dynamic-token"

[[case]]
description = "literal deletion flag straight after a wildcard executable (#360)"
command = "/* -D main"
expected = "deny"
rule_id = "core.git:branch-dynamic-token"

[[case]]
description = "a wrapper is not a proof about the heredoc receiver (#357)"
command = "env python3 - <<'PY'\ngit branch $name\nPY"
expected = "deny"
rule_id = "core.git:branch-dynamic-token"

[[case]]
description = "visible rebinding of the interpreter name keeps the deny (#357)"
command = "alias python3='bash -s'\npython3 - <<'PY'\ngit branch $name\nPY"
expected = "deny"
rule_id = "core.git:branch-dynamic-token"

[[case]]
description = "a real invocation after the terminator is outside the body (#357)"
command = "python3 - <<'PY'\nx = 1\nPY\ngit branch $name"
expected = "deny"
rule_id = "core.git:branch-dynamic-token"

# ============================================================================
# Home-subtree move rescue must not become a relocate-then-delete bypass
#
# `mv-within-home` allows a rename that stays inside one home subtree. These
# are the shapes it must never rescue: a home root or top-level home directory
# as the source, a dotfile tree on either side, a `..` escape, a dynamic path,
# a flag carrying a target value, a hop out of the home tree, and a compound
# command whose second segment is destructive.
# ============================================================================

[[case]]
description = "moving a whole home root is still the relocate half of the bypass"
command = "mv /Users/merlin /tmp/x"
expected = "deny"

[[case]]
description = "moving a top-level home directory is a restructure, not a rename"
command = "mv ~/Documents ~/Docs"
expected = "deny"

[[case]]
description = "home-subtree rescue does not extend to dotfile trees"
command = "mv ~/.ssh/id_rsa ~/Documents/x"
expected = "deny"

[[case]]
description = "home-subtree rescue does not allow writing into a dotfile tree"
command = "mv ~/Documents/x ~/.ssh/authorized_keys"
expected = "deny"

[[case]]
description = "dot-dot cannot climb out of the home tree it names"
command = "mv ~/Documents/a ~/Documents/../../etc/x"
expected = "deny"

[[case]]
description = "quoted dot-dot escape from a home subtree is still denied"
command = "mv \"/Users/merlin/Documents/../.ssh/key\" \"/Users/merlin/Documents/x\""
expected = "deny"

[[case]]
description = "expanded home variable still fails closed"
command = "mv \"$HOME/Documents/a\" ~/Documents/b"
expected = "deny"

[[case]]
description = "a value-taking flag cannot smuggle a system target"
command = "mv -t /etc ~/Documents/a"
expected = "deny"

[[case]]
description = "leaving the home tree for tmp is still relocate-then-delete"
command = "mv ~/Documents/a/b /tmp/x"
expected = "deny"

[[case]]
description = "trash rescue does not launder a sensitive source"
command = "mv /etc ~/.Trash/"
expected = "deny"
