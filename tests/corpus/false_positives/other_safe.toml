# False positives: non-git safe commands that MUST be allowed
#
# These commands should pass through without blocking.

[[case]]
description = "ls is safe"
command = "ls -la"
expected = "allow"

[[case]]
description = "cat is safe"
command = "cat file.txt"
expected = "allow"

[[case]]
description = "echo is safe"
command = "echo hello"
expected = "allow"

[[case]]
description = "pwd is safe"
command = "pwd"
expected = "allow"

[[case]]
description = "mkdir is safe"
command = "mkdir -p new_dir"
expected = "allow"

[[case]]
description = "cp is safe"
command = "cp file.txt backup.txt"
expected = "allow"

[[case]]
description = "mv is safe"
command = "mv old.txt new.txt"
expected = "allow"

[[case]]
description = "touch is safe"
command = "touch newfile.txt"
expected = "allow"

[[case]]
description = "grep is safe"
command = "grep -r 'pattern' ."
expected = "allow"

[[case]]
description = "find is safe"
command = "find . -name '*.rs'"
expected = "allow"

[[case]]
description = "cargo build is safe"
command = "cargo build --release"
expected = "allow"

[[case]]
description = "cargo test is safe"
command = "cargo test"
expected = "allow"

[[case]]
description = "cargo run is safe"
command = "cargo run"
expected = "allow"

[[case]]
description = "npm install is safe"
command = "npm install"
expected = "allow"

[[case]]
description = "python script is safe"
command = "python script.py"
expected = "allow"

[[case]]
description = "make is safe"
command = "make all"
expected = "allow"

# ============================================================================
# Ordinary file organisation inside one home subtree
#
# `mv-sensitive-source-root-home` fires on any mv mentioning /Users or /home,
# which denied every rename under a home directory. Both sides here stay at
# least two components below the same home-root form, so nothing leaves the
# home tree and the relocate-then-delete bypass the rule exists for is not
# reachable. Quoted spellings matter: a personal filename containing a space
# must be quoted, and the rescues used to read bare words only.
# ============================================================================

[[case]]
description = "rename inside a home subtree is ordinary file organisation"
command = "mv /Users/merlin/Documents/a.txt /Users/merlin/Documents/b.txt"
expected = "allow"

[[case]]
description = "tilde rename inside a home subtree is safe"
command = "mv ~/Documents/Personal ~/Documents/_archived/"
expected = "allow"

[[case]]
description = "quoted home-subtree move with spaces in the name is safe"
command = "mv \"/Users/merlin/Documents/Personal/Admin/758 Texola Court Sale\" \"/Users/merlin/Documents/_archived/\""
expected = "allow"

[[case]]
description = "single-quoted home-subtree move is safe"
command = "mv '/Users/merlin/Documents/a b.txt' '/Users/merlin/Desktop/'"
expected = "allow"

[[case]]
description = "linux home-subtree move is safe"
command = "mv /home/user/docs/notes /home/user/docs/archive/"
expected = "allow"

[[case]]
description = "quoted soft-delete into the macOS Trash is the documented remediation"
command = "mv \"/Users/merlin/Documents/a b.txt\" ~/.Trash/"
expected = "allow"

[[case]]
description = "soft-delete into a resolved-home Trash path is safe"
command = "mv \"/Users/merlin/Documents/Personal/Admin\" /Users/merlin/.Trash/"
expected = "allow"
