# #289 follow-up — `executables=` scoping must survive compound-command syntax
#
# `executables = Some(list)` (#289-B) fires a rule only against a segment whose
# resolved argv0 is in the list. argv0 was the leading whitespace-delimited word
# of the raw segment, so every grouping character and reserved word that may
# precede a simple command became the "executable" and the scoped rule went
# silent: `if true; then chmod -R 755 /etc; fi` resolved `then`, `(chmod …)`
# resolved `(chmod`. That is a deny→allow false negative on a security rule.
#
# These are true-positive *controls*: each one runs chmod/chown/setfacl against
# a system path in every dialect listed for that case. POSIX-only control-flow
# forms are deliberately limited to `posix` and fail-closed `unknown`: Cmd and
# PowerShell reject those forms without executing their bodies. The companion
# false-positive shapes live in issue_287_permission_chains.toml — the two
# files together pin both sides of the boundary.

[[case]]
description = "subshell around chmod -R on /etc"
command = "(chmod -R 755 /etc)"
expected = "deny"
rule_id = "system.permissions:chmod-recursive-root"
issue = 289

[[case]]
description = "spaced subshell around chmod -R on /etc"
command = "( chmod -R 755 /etc )"
expected = "deny"
rule_id = "system.permissions:chmod-recursive-root"
issue = 289

[[case]]
description = "nested subshells around chmod -R on /etc"
command = "( (chmod -R 755 /etc) )"
expected = "deny"
rule_id = "system.permissions:chmod-recursive-root"
issue = 289

[[case]]
description = "brace group around chmod -R on /etc"
command = "{ chmod -R 755 /etc; }"
expected = "deny"
rule_id = "system.permissions:chmod-recursive-root"
issue = 289
dialects = ["posix", "unknown"]

[[case]]
description = "if/then guarding chmod -R on /etc"
