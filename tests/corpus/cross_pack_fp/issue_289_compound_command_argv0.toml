# Findings 2 and 3: under Cmd the whole `;`-joined line is one segment, so a
# greedy full-command match straddled a POSIX `;` (and was dropped by the #287
# cross-boundary guard with no per-segment retry), while argv0 came from the
# line's leading token instead of the token that runs chmod. Segment-scoped
# packs are now evaluated against POSIX segments under Cmd/PowerShell.

[[case]]
description = "two chmod -R commands joined by a semicolon"
command = "chmod -R 755 /etc; chmod -R 755 /usr"
expected = "deny"
rule_id = "system.permissions:chmod-recursive-root"
issue = 287

[[case]]
description = "chmod -R on /etc followed by a cd"
command = "chmod -R 755 /etc; cd /var"
expected = "deny"
rule_id = "system.permissions:chmod-recursive-root"
issue = 287

[[case]]
description = "two chown -R commands joined by a semicolon"
command = "chown -R u:g /etc; chown -R u:g /usr"
expected = "deny"
rule_id = "system.permissions:chown-recursive-root"
issue = 287

[[case]]
description = "two setfacl -R commands joined by a semicolon"
command = "setfacl -R -m u:x:rwx /etc; setfacl -R -m u:x:rwx /usr"
expected = "deny"
issue = 287

[[case]]
description = "two chmod 777 commands joined by a semicolon"
command = "chmod 777 /etc/a; chmod 777 /etc/b"
expected = "deny"
issue = 287

[[case]]
description = "leading separator before chmod -R on /etc"
command = "; chmod -R 755 /etc"
expected = "deny"
rule_id = "system.permissions:chmod-recursive-root"
issue = 289

[[case]]
description = "two earlier commands before chmod -R on /etc"
command = "a; b; chmod -R 755 /etc"
expected = "deny"
rule_id = "system.permissions:chmod-recursive-root"
issue = 289

[[case]]
description = "assignment-only segment before chmod -R on /etc"
command = "VAR=1; chmod -R 755 /etc"
expected = "deny"
rule_id = "system.permissions:chmod-recursive-root"
issue = 289
