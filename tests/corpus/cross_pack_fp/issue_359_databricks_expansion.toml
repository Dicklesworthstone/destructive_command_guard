# database.databricks — GH#359 follow-up scope.
#
# The pack is opt-in, so these run in the force-all-packs cross-pack suite.
# The force/auto-approve forms are the ones the issue singles out: they
# override the CLI's own non-empty checks and confirmation prompts, so the
# guard is the last line before an irreversible control-plane deletion.

[[case]]
description = "metastore deletion with --force removes a non-empty metastore (#359)"
command = "databricks metastores delete 12345678-abcd --force"
expected = "deny"
rule_id = "database.databricks:databricks-metastores-delete"
issue = 359

[[case]]
description = "account-level metastore deletion is the same operation via the account API (#359)"
command = "databricks account metastores delete 12345678-abcd --force"
expected = "deny"
rule_id = "database.databricks:databricks-metastores-delete"
issue = 359

[[case]]
description = "catalog deletion with --force overrides the non-empty check (#359)"
command = "databricks -p production catalogs delete analytics --force"
expected = "deny"
rule_id = "database.databricks:databricks-catalogs-delete-force"
issue = 359

[[case]]
description = "schema deletion with --force overrides the non-empty check (#359)"
command = "databricks schemas delete analytics.events --force"
expected = "deny"
rule_id = "database.databricks:databricks-schemas-delete-force"
issue = 359

[[case]]
description = "apps delete --auto-approve destroys the project deployment without confirmation (#359)"
command = "databricks apps delete --auto-approve"
expected = "deny"
rule_id = "database.databricks:databricks-apps-delete-auto-approve"
issue = 359

[[case]]
description = "account service principal deletion breaks automation account-wide (#359)"
command = "databricks account service-principals delete 1234567890"
expected = "deny"
rule_id = "database.databricks:databricks-account-identity-delete"
issue = 359

[[case]]
description = "account users-v2 deletion is an account-wide identity operation (#359)"
command = "databricks --profile production account users-v2 delete 42"
expected = "deny"
rule_id = "database.databricks:databricks-account-identity-delete"
issue = 359

[[case]]
description = "read-only metastore summary stays allowed under every pack (#359)"
command = "databricks metastores summary"
expected = "allow"
issue = 359

[[case]]
description = "read-only catalog get stays allowed under every pack (#359)"
command = "databricks catalogs get analytics"
expected = "allow"
issue = 359
