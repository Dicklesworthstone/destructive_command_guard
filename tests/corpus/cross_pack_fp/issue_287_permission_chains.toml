# Cross-pack false positives: #287 — segment-scoped permission patterns
#
# A recursive flag (or 777/u+s/root token) belonging to a *different* command
# in a chained line must not pair with a chmod/chown/setfacl elsewhere in the
# string. The fix landed in system.permissions; this file re-asks every other
# pack the same question, in every dialect.
#
# Source: c1f0dca / eee2bdc (fix(permissions): #287)

[[case]]
description = "chmod 600 then grep -rn: the -rn belongs to grep"
command = "chmod 600 /root/.ssh/x && grep -rn foo /etc/ssh/"
expected = "allow"
issue = 287

[[case]]
description = "chmod 600 then grep -rn across a newline, not a separator"
command = "chmod 600 /root/.ssh/authorized_keys\ngrep -rn PermitRootLogin /etc/ssh/sshd_config"
expected = "allow"
issue = 287

[[case]]
description = "chown then grep -R across a newline"
command = "chown app /var/log/x\ngrep -R foo /etc/passwd"
expected = "allow"
issue = 287

# Found by this suite, fixed afterwards: the #287 suppression used only the
# evaluated dialect's segmentation, and Cmd does not treat `;` as a command
# separator — so under `--dialect cmd` the whole line was one segment, nothing
# crossed a boundary, and the full-command match survived. chmod/chown/setfacl
# are POSIX utilities, so the evaluator now also consults the POSIX segment
# view for `SEGMENT_SCOPED_PACKS` under Cmd and PowerShell.
[[case]]
description = "chown then cp -R after a semicolon"
command = "chown user /var/log/app.log; cp -R src /opt/app"
expected = "allow"
issue = 287

[[case]]
description = "setfacl piped into ls -R: the -R belongs to ls"
command = "setfacl -m u:app:r /srv/f | ls -R /etc"
expected = "allow"
issue = 287

[[case]]
description = "chmod u+x then an echo of the literal 777"
command = "chmod u+x build.sh && echo 777"
expected = "allow"
issue = 287

[[case]]
description = "chown alice in /tmp then a sudo -u root: in the next segment"
command = "chown alice /tmp/f && sudo -u root: true"
expected = "allow"
issue = 287
