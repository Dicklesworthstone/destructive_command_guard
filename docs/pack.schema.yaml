$schema: "https://json-schema.org/draft/2020-12/schema"
title: "dcg external pack schema"
type: object
additionalProperties: false
required:
  - schema_version
  - id
  - name
  - version
properties:
  schema_version:
    type: integer
    minimum: 1
    description: Schema version for forward compatibility.
    default: 1
  id:
    type: string
    pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
    description: Unique pack identifier (e.g., mycompany.policies).
  name:
    type: string
    description: Human-readable pack name.
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: Semantic version of the pack definition.
  description:
    type: string
    description: What this pack protects against.
  keywords:
    type: array
    description: Keywords that trigger evaluation for this pack.
    items:
      type: string
    default: []
  default_effects:
    type: array
    description: |
      v0.6+ optional pack-level Tier-B fallback for rules that don't
      carry their own `effects` field. When omitted, falls back to
      the in-code `DEFAULT_PACK_EFFECTS` (`[write, irreversible]`).
    items:
      $ref: "#/definitions/effect"
  destructive_patterns:
    type: array
    description: Patterns that block or warn based on severity.
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - pattern
      properties:
        name:
          type: string
          description: Stable pattern identifier within the pack.
        pattern:
          type: string
          description: fancy-regex pattern to match.
        severity:
          type: string
          enum: [low, medium, high, critical]
          default: high
          description: Default decision mode based on severity.
        description:
          type: string
          description: Short human-readable reason shown on denial.
        explanation:
          type: string
          description: Longer explanation shown in verbose output.
        effects:
          type: array
          description: |
            v0.6+ optional Tier-A explicit effect tags that override
            the parent pack's `default_effects` for this rule.
          items:
            $ref: "#/definitions/effect"
    default: []
  safe_patterns:
    type: array
    description: Patterns that explicitly allow commands.
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - pattern
      properties:
        name:
          type: string
          description: Stable pattern identifier within the pack.
        pattern:
          type: string
          description: fancy-regex pattern to match.
        description:
          type: string
          description: Short reason for allowlisting.
    default: []
definitions:
  effect:
    type: string
    enum:
      - read
      - write
      - network
      - spawn
      - irreversible
      - mutate_vcs
      - fs
    description: |
      A coarse-grained effect tag used by v0.6 permission modes to
      classify what a rule does. See `docs/permission-modes.md`.
